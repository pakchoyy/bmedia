<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Pahlawan Ketik · Main-yuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b1a3a; --cream:#fff6dc; --yellow:#ffd23f; --orange:#ff7a1a; --pink:#ff5d8f; --mint:#2ec4b6; --blue:#4aa8ff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#120f2e; color:var(--ink); }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .hidden { display:none !important; }
  .nb { border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); }
  .nb-sm { border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .press:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:10px; overflow:auto; z-index:20; }
  .card { background:#fff; border-radius:22px; padding:16px 20px; width:min(100%, 640px); text-align:center; margin:auto; }
  .card h1 { font-size:clamp(28px, 6vh, 46px); line-height:1.05; }
  .card h1 span { color:var(--pink); }
  .sub { font-size:14px; font-weight:700; opacity:.75; margin-top:4px; }
  .setinfo { margin-top:8px; font-size:12px; font-weight:800; background:#fff3c4; border:2px solid var(--ink); border-radius:10px; padding:3px 10px; display:inline-block; }
  .setinfo.ok { background:#c8f7dc; } .setinfo.err { background:#ffd6d6; }
  .row { margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .lbl { font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .seg button { padding:7px 13px; border-radius:12px; font-weight:900; font-size:15px; background:#fff; }
  .seg button.on { background:var(--yellow); }
  .off { opacity:.35; pointer-events:none; }
  #name { margin-top:10px; width:100%; font:inherit; font-weight:800; border:2px solid var(--ink); border-radius:10px; padding:8px 10px; }
  .best { margin-top:8px; font-weight:800; font-size:13px; }
  #start { margin-top:12px; width:100%; padding:12px; border-radius:16px; background:var(--pink); }
  #menu { background:radial-gradient(circle at 20% 20%, #3b2f8f, #120f2e 70%); }
  #menu::before { content:''; position:absolute; inset:0; background:radial-gradient(#fff 1px, transparent 1.5px) 0 0/40px 40px; opacity:.25; pointer-events:none; }

  #game { position:absolute; inset:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hud { position:absolute; top:6px; left:8px; right:8px; display:flex; gap:6px; align-items:center; z-index:5; font:800 14px Nunito, sans-serif; flex-wrap:wrap; }
  .pill { background:#fff; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); border-radius:99px; padding:2px 11px; white-space:nowrap; }
  .pill.combo { background:var(--yellow); }
  .hud .sp { flex:1; }
  .hud button { background:#fff; border:2px solid var(--ink); border-radius:99px; width:32px; height:32px; }
  #inp { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); width:min(92%, 380px); z-index:6; font:800 20px Nunito, sans-serif; text-align:center; border:3px solid var(--ink); border-radius:14px; padding:6px 10px; background:rgba(255,255,255,.92); text-transform:lowercase; }
  #inp:focus { outline:3px solid var(--yellow); }
  .banner { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); z-index:6; font:700 clamp(30px, 8vh, 64px) Fredoka, sans-serif; color:#fff; text-shadow:4px 4px 0 var(--ink); pointer-events:none; animation:bn 1.6s forwards; white-space:nowrap; }
  @keyframes bn { 0% { opacity:0; transform:translate(-50%,-50%) scale(.5); } 20% { opacity:1; transform:translate(-50%,-50%) scale(1.1); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-70%); } }

  #over { background:rgba(18,15,46,.82); }
  .stat { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .stat div { background:var(--cream); border-radius:12px; padding:6px 2px; font:700 22px Fredoka, sans-serif; }
  .stat small { display:block; font:800 11px Nunito, sans-serif; opacity:.7; }
  .kb { margin-top:12px; display:grid; gap:4px; }
  .kb .r { display:flex; justify-content:center; gap:4px; }
  .kb span { width:clamp(22px, 7vw, 36px); height:clamp(24px, 4.5vh, 34px); border:2px solid var(--ink); border-radius:7px; display:flex; align-items:center; justify-content:center; font:800 13px Nunito, sans-serif; text-transform:uppercase; background:#fff; }
  .kbt { margin-top:10px; font-weight:900; font-size:13px; }
  .btns { margin-top:12px; display:flex; gap:8px; } .btns button { flex:1; padding:12px; border-radius:14px; font-weight:900; font-size:16px; }
  #saved { margin-top:8px; font-size:13px; font-weight:800; } #saved a { color:inherit; }
</style>
<link rel="stylesheet" href="/games/_shared/theme.css">
</head>
<body>
<div id="menu" class="screen">
  <div class="card nb">
    <h1>Pahlawan <span>Ketik</span> ⌨️</h1>
    <div class="sub">Monster huruf menyerang sekolah! Ketik kata di tubuh monster untuk menembaknya sebelum sampai ke markas.</div>
    <div class="setinfo" id="setinfo">🔤 Kata bawaan</div>
    <div class="row mathonly"><span class="lbl">Isi</span>
      <div class="seg" id="segMode"><button class="nb-sm press" data-n="kata">🔤 Kata</button><button class="nb-sm press" data-n="ipa">🔬 Istilah</button><button class="nb-sm press" data-n="hitung">🧮 Hitung</button></div></div>
    <div class="row"><span class="lbl">Tingkat</span>
      <div class="seg" id="segLevel"><button class="nb-sm press" data-n="1">Mudah</button><button class="nb-sm press" data-n="2">Sedang</button><button class="nb-sm press" data-n="3">Sulit</button></div></div>
    <input id="name" maxlength="30" placeholder="Nama kamu (untuk skor kelas)" class="hidden" autocomplete="off">
    <div class="best" id="best"></div>
    <button id="start" class="nb press">🚀 MULAI</button>
  </div>
</div>

<div id="game" class="hidden">
  <canvas id="cv"></canvas>
  <div class="hud">
    <span class="pill" id="hScore">0</span>
    <span class="pill" id="hWave">Gelombang 1</span>
    <span class="pill" id="hLife">❤️❤️❤️</span>
    <span class="pill combo hidden" id="hCombo"></span>
    <span class="sp"></span>
    <span class="pill" id="hWpm">0 kpm</span>
    <button id="bMute" class="press" aria-label="Suara">🔊</button>
    <button id="bExit" class="press" aria-label="Selesai">✖</button>
  </div>
  <input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ketik di sini…" aria-label="Ketik kata">
</div>

<div id="over" class="screen hidden">
  <div class="card nb">
    <h1 id="oTitle">Selesai!</h1>
    <div class="stat">
      <div><span id="oScore">0</span><small>Skor</small></div>
      <div><span id="oWpm">0</span><small>Kata/menit</small></div>
      <div><span id="oAcc">0%</span><small>Akurasi</small></div>
      <div><span id="oWave">1</span><small>Gelombang</small></div>
    </div>
    <div class="kbt" id="oKbt">Tombol yang paling sering salah</div>
    <div class="kb" id="kb"></div>
    <div id="saved"></div>
    <div class="btns"><button id="again" class="nb press" style="background:var(--pink)">🔄 Main Lagi</button><button id="toMenu" class="nb press" style="background:var(--yellow)">🏠 Menu</button></div>
  </div>
</div>

<script src="/games/_shared/mathgen.js"></script>
<script src="/games/_shared/sfx.js"></script>
<script src="/games/_shared/koin.js"></script>
<script src="/games/_shared/fx.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var WORDS = {
    kata: {
      1: 'buku pena meja tas topi bola ikan ayam sapi kuda nasi roti susu teh gula air api batu kayu daun bunga pohon padi rumah pintu kaca lampu jam bulan awan hujan angin laut gigi mata kaki jari ibu ayah adik guru kelas apel jeruk'.split(' '),
      2: 'sekolah belajar membaca menulis bermain sepeda kancil gajah harimau pelangi matahari sawah petani nelayan pasar jendela lemari pensil penggaris bendera garuda gunung sungai danau pantai hutan cuaca tanaman hewan sayuran olahraga upacara kantin halaman'.split(' '),
      3: 'perpustakaan kemerdekaan proklamasi musyawarah kebudayaan keberagaman persatuan lingkungan pelestarian pendidikan matematika kesehatan kebersihan kejujuran tanggungjawab nusantara kepulauan perjuangan pahlawan'.split(' ')
    },
    ipa: {
      1: 'akar daun batang bunga buah biji air udara tanah api panas dingin awan hujan petir angin magnet bumi bulan'.split(' '),
      2: 'oksigen planet galaksi energi listrik cahaya bunyi getaran gravitasi tumbuhan herbivora karnivora omnivora kepompong ekosistem habitat'.split(' '),
      3: 'fotosintesis metamorfosis perkembangbiakan pernapasan pencernaan peredaran evaporasi kondensasi presipitasi konduktor isolator klorofil'.split(' ')
    }
  };
  var mode = 'kata', level = 1, setQ = null, setCode = null;
  try { mode = localStorage.getItem('pk_mode') || 'kata'; level = +localStorage.getItem('pk_level') || 1; } catch (e) {}

  // ---------- soal guru (jawaban pendek diketik) ----------
  (function loadSet() {
    var code = (new URLSearchParams(location.search).get('set') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) return;
    var info = $('setinfo'); info.textContent = '⏳ Memuat soal dari guru...';
    fetch('/api/set/' + code).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }).then(function (d) {
      var qs = [];
      (Array.isArray(d.questions) ? d.questions : []).forEach(function (q, i) {
        if (!q || !Array.isArray(q.o) || !(q.a >= 0 && q.a < q.o.length)) return;
        var w = String(q.o[q.a]).toLowerCase().replace(/\s+/g, ' ').trim();
        if (w.length >= 1 && w.length <= 16 && /^[a-z0-9\- ]+$/.test(w)) qs.push({ w: w, clue: String(q.q).slice(0, 60), idx: i });
      });
      if (!qs.length) throw new Error('tidak cocok');
      setQ = qs; setCode = code;
      info.textContent = '📚 Soal guru: ' + d.title + ' (' + qs.length + ' jawaban)'; info.className = 'setinfo ok';
      document.querySelector('.mathonly').classList.add('off'); $('name').classList.remove('hidden');
      try { $('name').value = localStorage.getItem('bgy_name') || ''; } catch (e) {}
    }).catch(function (e) { info.textContent = e && e.message === 'tidak cocok' ? '⚠️ Jawaban soal guru terlalu panjang. Memakai kata bawaan.' : '⚠️ Kode soal tidak ditemukan. Memakai kata bawaan.'; info.className = 'setinfo err'; });
  })();

  function seg(id, fn, isOn) {
    var el = $(id);
    function mark() { [].forEach.call(el.children, function (b) { b.classList.toggle('on', isOn(b.dataset.n)); }); showBest(); }
    el.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; fn(b.dataset.n); mark(); Sfx.click(); });
    mark();
  }
  function bestKey() { return 'pk_best_' + (setQ ? 'guru' : mode) + level; }
  function getBest() { try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } }
  function showBest() { var b = getBest(); $('best').textContent = b ? '🏆 Rekor kamu: ' + b : ''; }
  seg('segMode', function (n) { mode = n; }, function (n) { return n === mode; });
  seg('segLevel', function (n) { level = +n; }, function (n) { return +n === level; });

  // ---------- kanvas ----------
  var cv = $('cv'), ctx = cv.getContext('2d'), W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  window.addEventListener('resize', resize);
  var stars = []; for (var i = 0; i < 90; i++) stars.push({ x: Math.random(), y: Math.random(), s: Math.random() * 1.8 + .4, v: Math.random() * .02 + .005 });
  var COLORS = ['#ff5d8f', '#4aa8ff', '#2ec4b6', '#ffd23f', '#ff7a1a', '#b79cff', '#8cf0b8'];

  // ---------- state ----------
  var enemies = [], bullets = [], parts = [], target = null, score = 0, lives = 3, combo = 0, wave = 1, toSpawn = 0, spawnT = 0, running = false, raf = 0, last = 0;
  var typed = 0, wrong = 0, words = 0, startAt = 0, shake = 0, miss = {}, qstats = {}, bag = [], waveBreak = 0, killedWave = 0;
  var ship = { x: 0, y: 0, ang: -Math.PI / 2 };

  function pickWord() {
    if (setQ) { if (!bag.length) bag = setQ.slice().sort(function () { return Math.random() - .5; }); var q = bag.pop(); return { w: q.w, clue: q.clue, idx: q.idx }; }
    if (mode === 'hitung') { var m = MathGen.make(['add', 'sub', 'mul', 'div'][Math.floor(Math.random() * (level === 1 ? 2 : 4))], level); return { w: m.o[m.a], clue: m.q.replace(' = ?', '') }; }
    var list = WORDS[mode][Math.min(3, level + (wave > 6 ? 1 : 0))] || WORDS[mode][level];
    var used = enemies.map(function (e) { return e.word[0]; }), w, tries = 0;
    do { w = list[Math.floor(Math.random() * list.length)]; tries++; } while (tries < 20 && used.indexOf(w[0]) >= 0);
    return { w: w };
  }

  function spawn(boss) {
    var p = pickWord();
    if (boss && !setQ && mode !== 'hitung') { var l3 = WORDS[mode][3]; p = { w: l3[Math.floor(Math.random() * l3.length)] }; }
    var e = {
      word: p.w, clue: p.clue, idx: p.idx, hit: 0, boss: !!boss,
      x: W * (0.12 + Math.random() * 0.76), y: -40,
      r: boss ? 46 : 24 + Math.min(10, p.w.length),
      col: boss ? '#ff5d8f' : COLORS[Math.floor(Math.random() * COLORS.length)],
      spd: (boss ? 14 : 22 + level * 6 + wave * 2.2) * (H / 700), wob: Math.random() * 6, hurt: 0
    };
    enemies.push(e);
  }

  function banner(t) { var b = document.createElement('div'); b.className = 'banner'; b.textContent = t; $('game').appendChild(b); setTimeout(function () { b.remove(); }, 1700); }

  function startWave() {
    toSpawn = 4 + wave * 2; killedWave = 0; spawnT = 600;
    banner(wave % 5 === 0 ? '👾 BOS DATANG!' : 'Gelombang ' + wave);
    if (wave % 5 === 0) setTimeout(function () { if (running) spawn(true); }, 900);
    $('hWave').textContent = 'Gelombang ' + wave;
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n; i++) { var a = Math.random() * 6.28, s = 60 + Math.random() * 260; parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5 + Math.random() * .5, c: Math.random() < .3 ? '#fff' : col, r: 2 + Math.random() * 4 }); }
  }
  function floatText(x, y, t, c) { parts.push({ x: x, y: y, vx: 0, vy: -60, life: 1, txt: t, c: c || '#ffd23f' }); }

  // ---------- input ----------
  function key(ch) {
    if (!running || waveBreak > 0) return;
    ch = ch.toLowerCase();
    if (!target) {
      var cand = enemies.filter(function (e) { return e.word[0] === ch && e.y > -30; }).sort(function (a, b) { return b.y - a.y; });
      if (cand.length) target = cand[0];
    }
    if (target && target.word[target.hit] === ch) {
      target.hit++; typed++; Sfx.click();
      bullets.push({ x: ship.x, y: ship.y - 18, t: target, v: 1500 });
      if (target.hit >= target.word.length) {
        var e = target; target = null; words++; combo++; killedWave++;
        if (e.idx != null) { var qs = qstats[e.idx] || (qstats[e.idx] = [0, 0]); qs[0]++; }
        var mult = 1 + Math.floor(combo / 5);
        var gain = e.word.replace(/ /g, '').length * 10 * mult * (e.boss ? 3 : 1);
        score += gain; e.dead = true;
        setTimeout(function () { burst(e.x, e.y, e.col, e.boss ? 90 : 36); floatText(e.x, e.y - e.r, '+' + gain); shake = e.boss ? 18 : 6; Sfx.pop(); if (e.boss) { Sfx.win(); Fx.mascot('sorak'); } }, 90);
        enemies = enemies.filter(function (x) { return x !== e; });
      }
    } else {
      wrong++; combo = 0; Sfx.bad();
      var k = ch.length === 1 ? ch : '?'; miss[k] = (miss[k] || 0) + 1;
      shake = Math.max(shake, 4);
    }
    hud();
  }
  var inp = $('inp');
  inp.addEventListener('input', function () { var v = inp.value; inp.value = ''; for (var i = 0; i < v.length; i++) if (v[i] !== ' ' || (target && target.word[target.hit] === ' ')) key(v[i]); });
  inp.addEventListener('keydown', function (e) { if (e.key === 'Escape') { target = null; } if (e.key === 'Backspace') { target = null; e.preventDefault(); } });
  $('cv').addEventListener('pointerdown', function () { inp.focus(); });

  function hud() {
    $('hScore').textContent = score;
    $('hLife').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
    var c = $('hCombo'); c.classList.toggle('hidden', combo < 3); c.textContent = '🔥 ' + combo + ' combo · x' + (1 + Math.floor(combo / 5));
    var min = Math.max(1 / 60, (performance.now() - startAt) / 60000); $('hWpm').textContent = Math.round(typed / 5 / min) + ' kpm';
  }

  // ---------- gambar ----------
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
  function drawShip(t) {
    ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.ang + Math.PI / 2);
    // api
    ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.moveTo(-9, 22); ctx.lineTo(0, 34 + Math.sin(t / 40) * 6); ctx.lineTo(9, 22); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(-5, 22); ctx.lineTo(0, 28 + Math.sin(t / 30) * 4); ctx.lineTo(5, 22); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#1b1a3a';
    ctx.fillStyle = '#ff5d8f'; ctx.beginPath(); ctx.moveTo(-14, 16); ctx.lineTo(-24, 26); ctx.lineTo(-10, 22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14, 16); ctx.lineTo(24, 26); ctx.lineTo(10, 22); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -28); ctx.quadraticCurveTo(16, -8, 12, 22); ctx.lineTo(-12, 22); ctx.quadraticCurveTo(-16, -8, 0, -28); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4aa8ff'; ctx.beginPath(); ctx.arc(0, -4, 6, 0, 6.28); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  function drawSchool() {
    var y = H - 112;
    ctx.fillStyle = '#2c6e3f'; ctx.fillRect(0, y + 34, W, H); ctx.fillStyle = '#3f8f52'; ctx.fillRect(0, y + 34, W, 6);
    ctx.fillStyle = '#fff6dc'; ctx.strokeStyle = '#1b1a3a'; ctx.lineWidth = 3;
    var w = Math.min(260, W * .5), x = W / 2 - w / 2;
    rr(x, y - 6, w, 40, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff7a1a'; ctx.beginPath(); ctx.moveTo(x - 10, y - 4); ctx.lineTo(W / 2, y - 30); ctx.lineTo(x + w + 10, y - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(74,168,255,.14)'; ctx.strokeStyle = 'rgba(140,220,255,' + (.35 + lives * .15) + ')'; ctx.beginPath(); ctx.arc(W / 2, y + 34, w * .7, Math.PI, 0); ctx.fill(); ctx.stroke(); // perisai
    ctx.fillStyle = '#1b1a3a'; ctx.font = '900 14px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('SD MAIN-YUK', W / 2, y + 14);
  }
  function drawEnemy(e, t) {
    var x = e.x + Math.sin(t / 500 + e.wob) * 6, y = e.y, r = e.r;
    ctx.save(); ctx.translate(x, y);
    if (e.hurt > 0) ctx.translate((Math.random() - .5) * 6, 0);
    ctx.lineWidth = 3; ctx.strokeStyle = '#1b1a3a';
    // tentakel
    ctx.fillStyle = e.col; for (var k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(k * r * .35, r * .75 + Math.sin(t / 120 + k) * 3, r * .16, r * .32, 0, 0, 6.28); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.28); ctx.fill(); ctx.stroke();
    if (e.boss) { ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(-r * .6, -r * .8); ctx.lineTo(-r * .3, -r * 1.25); ctx.lineTo(0, -r * .85); ctx.lineTo(r * .3, -r * 1.25); ctx.lineTo(r * .6, -r * .8); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    // mata
    var look = e === target ? 1 : 0;
    [-1, 1].forEach(function (s) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * r * .36, -r * .1, r * .26, 0, 6.28); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#1b1a3a'; ctx.beginPath(); ctx.arc(s * r * .36 + (ship.x - x) / W * 4, -r * .06 + 2 * look, r * .12, 0, 6.28); ctx.fill(); });
    ctx.strokeStyle = '#1b1a3a'; ctx.beginPath(); ctx.arc(0, r * .3, r * .22, 0.1, Math.PI - 0.1); ctx.stroke();
    ctx.restore();
    // label kata
    var fs = Math.max(15, Math.min(24, W / 38)) * (e.boss ? 1.2 : 1);
    ctx.font = '800 ' + fs + 'px Nunito, sans-serif';
    var label = e.word, tw = ctx.measureText(label).width + 18, ly = y + r + 22;
    if (e.clue) { ctx.font = '700 ' + (fs * .75) + 'px Nunito, sans-serif'; var cw = ctx.measureText(e.clue).width + 14; ctx.fillStyle = 'rgba(255,255,255,.85)'; rr(x - cw / 2, y - r - 34, cw, fs, 8); ctx.fill(); ctx.fillStyle = '#1b1a3a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e.clue, x, y - r - 34 + fs / 2); ctx.font = '800 ' + fs + 'px Nunito, sans-serif'; }
    var hide = !!e.clue && e.hit === 0 && setQ; // soal guru: jawaban disembunyikan sampai mulai ditebak
    if (hide) { label = '?'.repeat(Math.min(e.word.length, 8)); tw = ctx.measureText(label).width + 18; }
    ctx.fillStyle = e === target ? '#ffd23f' : '#fff'; ctx.strokeStyle = '#1b1a3a'; ctx.lineWidth = 2.5;
    rr(x - tw / 2, ly - fs * .75, tw, fs * 1.45, 10); ctx.fill(); ctx.stroke();
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var sx = x - tw / 2 + 9;
    for (var i = 0; i < label.length; i++) {
      ctx.fillStyle = i < e.hit ? '#ff7a1a' : '#1b1a3a';
      if (i < e.hit) ctx.globalAlpha = .55;
      ctx.fillText(hide ? label[i] : e.word[i], sx, ly); sx += ctx.measureText(hide ? label[i] : e.word[i]).width; ctx.globalAlpha = 1;
    }
  }

  function frame(t) {
    if (!running) return;
    var dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
    ship.x = W / 2; ship.y = H - 170;
    // logika
    if (waveBreak > 0) { waveBreak -= dt; if (waveBreak <= 0) { wave++; startWave(); } }
    else {
      spawnT -= dt * 1000;
      if (toSpawn > 0 && spawnT <= 0) { spawn(false); toSpawn--; spawnT = Math.max(650, 2100 - wave * 110 - level * 150); }
      if (toSpawn <= 0 && !enemies.length) { waveBreak = 2.2; score += wave * 50; floatText(W / 2, H / 2, 'Gelombang selesai! +' + wave * 50, '#8cf0b8'); Sfx.coin && Sfx.coin(); }
    }
    enemies.forEach(function (e) {
      var dx = ship.x - e.x, dy = (ship.y - 10) - e.y, d = Math.hypot(dx, dy) || 1;
      e.x += dx / d * e.spd * dt * .35; e.y += dy / d * e.spd * dt; e.hurt = Math.max(0, e.hurt - dt * 4);
      if (d < e.r + 30) { e.dead = true; lives--; combo = 0; shake = 16; burst(e.x, e.y, '#ff5d8f', 40); Sfx.bad(); Fx.bad(null, e.x, e.y);
        if (e.idx != null) { var qs = qstats[e.idx] || (qstats[e.idx] = [0, 0]); qs[1]++; }
        if (e === target) target = null; }
    });
    enemies = enemies.filter(function (e) { return !e.dead; });
    if (target) ship.ang += (Math.atan2(target.y - ship.y, target.x - ship.x) - ship.ang) * Math.min(1, dt * 14);
    else ship.ang += (-Math.PI / 2 - ship.ang) * Math.min(1, dt * 6);
    bullets.forEach(function (b) { var dx = b.t.x - b.x, dy = b.t.y - b.y, d = Math.hypot(dx, dy); if (d < 18) { b.done = true; b.t.hurt = 1; burst(b.t.x, b.t.y, '#fff', 5); } else { b.x += dx / d * b.v * dt; b.y += dy / d * b.v * dt; } });
    bullets = bullets.filter(function (b) { return !b.done; });
    parts.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; if (!p.txt) { p.vx *= .96; p.vy = p.vy * .96 + 200 * dt; } p.life -= dt; });
    parts = parts.filter(function (p) { return p.life > 0; });
    if (lives <= 0) { end(false); return; }
    if (wave > 10) { end(true); return; }
    // gambar
    ctx.save();
    if (shake > 0) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake = Math.max(0, shake - dt * 40); }
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#120f2e'); g.addColorStop(.6, '#2b2470'); g.addColorStop(1, '#4b3a9a'); ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.fillStyle = '#fff'; stars.forEach(function (s) { s.y += s.v * dt * 3; if (s.y > 1) s.y = 0; ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t / 900 + s.x * 20)); ctx.fillRect(s.x * W, s.y * H, s.s, s.s); }); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,214,120,.9)'; ctx.beginPath(); ctx.arc(W * .85, H * .14, Math.min(W, H) * .06, 0, 6.28); ctx.fill();
    drawSchool();
    enemies.forEach(function (e) { drawEnemy(e, t); });
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    bullets.forEach(function (b) { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - (b.t.x - b.x) * .04, b.y - (b.t.y - b.y) * .04); ctx.stroke(); });
    parts.forEach(function (p) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      if (p.txt) { ctx.font = '700 24px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#1b1a3a'; ctx.strokeText(p.txt, p.x, p.y); ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y); }
      else { ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
    }); ctx.globalAlpha = 1;
    drawShip(t);
    ctx.restore();
    if (Math.floor(t / 500) !== Math.floor((t - dt * 1000) / 500)) hud();
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (setQ) { var nm = ($('name').value || '').trim().slice(0, 30); if (!nm) { $('name').focus(); $('name').placeholder = 'Tulis namamu dulu ya'; return; } try { localStorage.setItem('bgy_name', nm); } catch (e) {} }
    try { localStorage.setItem('pk_mode', mode); localStorage.setItem('pk_level', level); } catch (e) {}
    enemies = []; bullets = []; parts = []; target = null; score = 0; lives = 3; combo = 0; wave = 1; typed = 0; wrong = 0; words = 0; miss = {}; qstats = {}; bag = []; waveBreak = 0; shake = 0;
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('game').classList.remove('hidden');
    $('inp').setAttribute('inputmode', mode === 'hitung' && !setQ ? 'numeric' : 'text');
    $('bMute').textContent = Sfx.muted() ? '🔇' : '🔊';
    resize(); running = true; last = 0; startAt = performance.now(); hud(); startWave(); Sfx.go(); Sfx.music(true);
    raf = requestAnimationFrame(frame); setTimeout(function () { inp.focus(); }, 60);
  }

  function end(win) {
    if (window.Koin) setTimeout(function () { Koin.add(score / 20, 'Pahlawan Ketik'); }, 400);
    running = false; cancelAnimationFrame(raf); Sfx.music(false);
    var min = Math.max(1 / 60, (performance.now() - startAt) / 60000), acc = typed + wrong ? Math.round(typed / (typed + wrong) * 100) : 0;
    var best = getBest(), rec = score > best; if (rec) try { localStorage.setItem(bestKey(), score); } catch (e) {}
    $('oScore').textContent = score; $('oWpm').textContent = Math.round(typed / 5 / min); $('oAcc').textContent = acc + '%'; $('oWave').textContent = Math.min(wave, 10);
    $('oTitle').textContent = win ? '🏆 Sekolah selamat!' : rec ? '🏆 Rekor baru!' : 'Markas jebol!';
    // peta panas keyboard
    var rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'], mx = Math.max.apply(null, [1].concat(Object.values(miss)));
    $('kb').innerHTML = rows.map(function (r) { return '<div class="r">' + r.split('').map(function (c) { var n = miss[c] || 0, a = n / mx; return '<span style="background:' + (n ? 'rgba(255,93,143,' + (.25 + a * .75) + ')' : '#fff') + '">' + c + '</span>'; }).join('') + '</div>'; }).join('');
    var top = Object.keys(miss).filter(function (k) { return /[a-z]/.test(k); }).sort(function (a, b) { return miss[b] - miss[a]; }).slice(0, 3);
    $('oKbt').textContent = top.length ? 'Paling sering salah: ' + top.map(function (k) { return k.toUpperCase(); }).join(', ') : 'Hebat, hampir tanpa salah ketik!';
    $('over').classList.remove('hidden');
    if (win || rec) { Sfx.win(); Fx.win(); } else Fx.mascot('sedih');
    var saved = $('saved'); saved.textContent = '';
    if (setCode && words) {
      saved.textContent = '⏳ Menyimpan skor ke kelas...';
      fetch('/api/set/' + setCode + '/hasil', { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
        body: JSON.stringify({ name: $('name').value.trim().slice(0, 30), mode: 'edu', score: score, caught: words, quizRight: words, quizWrong: Math.max(0, 3 - lives), durationS: Math.round(min * 60), qStats: qstats })
      }).then(function (r) { if (!r.ok) throw 0; saved.innerHTML = '✅ Skormu tersimpan di kelas · <a href="/papan/' + setCode + '" target="_top">🏆 Lihat peringkat</a>'; })
        .catch(function () { saved.textContent = '⚠️ Skor belum tersimpan (periksa internet)'; });
    }
  }

  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('toMenu').addEventListener('click', function () { $('over').classList.add('hidden'); $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); showBest(); });
  $('bExit').addEventListener('click', function () { if (confirm('Selesai bermain?')) end(false); });
  $('bMute').addEventListener('click', function () { try { localStorage.setItem('bgy_muted', Sfx.muted() ? '0' : '1'); } catch (e) {} this.textContent = Sfx.muted() ? '🔇' : '🔊'; Sfx.music(!Sfx.muted() && running); inp.focus(); });
  document.addEventListener('visibilitychange', function () { last = 0; });
})();
</script>
