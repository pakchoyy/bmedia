<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Pahlawan Ketik · Main-yuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b1a3a; --cream:#fff6dc; --yellow:#ffd23f; --orange:#ff7a1a; --pink:#ff5d8f; --mint:#2ec4b6; --blue:#4aa8ff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0d0b26; color:var(--ink); font-family:Nunito, sans-serif; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .hidden { display:none !important; }
  .nb { border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); }
  .nb-sm { border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .press:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:10px; overflow:auto; z-index:20; }
  .card { background:#fff; border-radius:22px; padding:16px 20px; width:min(100%, 600px); text-align:center; margin:auto; }
  .card h1 { font:700 clamp(28px, 6vh, 46px)/1.05 Fredoka, sans-serif; }
  .card h1 span { color:var(--pink); }
  .sub { font-size:15px; font-weight:700; opacity:.8; margin-top:6px; }
  .row { margin-top:12px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .lbl { font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; min-width:64px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .seg button { min-height:44px; padding:8px 14px; border-radius:12px; font-weight:900; font-size:15px; background:#fff; }
  .seg button.on { background:var(--yellow); }
  .best { margin-top:8px; font-weight:800; font-size:14px; min-height:18px; }
  #start { margin-top:12px; width:100%; min-height:52px; padding:12px; border-radius:16px; background:var(--pink); font:700 22px Fredoka, sans-serif; color:#fff; text-shadow:2px 2px 0 var(--ink); }
  #err { margin-top:8px; font-weight:800; color:#c0143c; font-size:14px; }
  #menu { background:radial-gradient(circle at 20% 20%, #3b2f8f, #0d0b26 70%); }
  #menu::before { content:''; position:absolute; inset:0; background:radial-gradient(#fff 1px, transparent 1.5px) 0 0/40px 40px; opacity:.25; pointer-events:none; }

  #game { position:absolute; inset:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1; min-height:0; overflow:hidden; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lb { position:absolute; left:0; top:0; transform:translate(-50%,-100%); white-space:nowrap; font:800 clamp(15px, 2.4vw, 22px) Nunito, sans-serif; background:#fff; border:2.5px solid var(--ink); border-radius:10px; padding:1px 9px; box-shadow:2px 2px 0 var(--ink); will-change:transform; }
  .lb.t { background:var(--yellow); }
  .lb.boss { font-size:clamp(17px, 2.9vw, 26px); background:#ffe0ea; }
  .lb.boss.t { background:var(--yellow); }
  .lb i { font-style:normal; color:var(--orange); opacity:.6; }
  .lb .clue { display:block; font-size:.72em; font-weight:800; opacity:.75; line-height:1.1; }
  .hud { position:absolute; top:6px; left:8px; right:8px; display:flex; gap:6px; align-items:center; z-index:5; font:800 14px Nunito, sans-serif; flex-wrap:wrap; }
  .pill { background:#fff; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); border-radius:99px; padding:3px 11px; white-space:nowrap; }
  .pill.combo { background:var(--yellow); }
  .hud .sp { flex:1; }
  @media (max-width:480px) { .hud { flex-wrap:nowrap; gap:4px; font-size:13px; } .pill { padding:3px 8px; } #hWpm, #hCombo { display:none !important; } .hud button { width:36px; height:36px; } }
  .hud button { background:#fff; border:2px solid var(--ink); border-radius:99px; width:40px; height:40px; font-size:16px; }
  .bar { flex:none; background:#1b1a3a; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:center; }
  #inp { width:min(100%, 420px); min-height:48px; font:800 22px Nunito, sans-serif; text-align:center; border:3px solid var(--ink); border-radius:14px; padding:6px 10px; background:#fff; }
  #inp:focus { outline:3px solid var(--yellow); }
  .banner { position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); z-index:6; font:700 clamp(30px, 8vh, 64px) Fredoka, sans-serif; color:#fff; text-shadow:4px 4px 0 var(--ink); pointer-events:none; animation:bn 1.7s ease forwards; white-space:nowrap; }
  @keyframes bn { 0% { opacity:0; transform:translate(-50%,-50%) scale(.5); } 20% { opacity:1; transform:translate(-50%,-50%) scale(1.1); } 80% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-70%); } }
  .pop { position:absolute; transform:translate(-50%,-50%); font:700 26px Fredoka, sans-serif; color:var(--yellow); text-shadow:2px 2px 0 var(--ink); pointer-events:none; animation:pp 1s ease-out forwards; }
  @keyframes pp { to { opacity:0; transform:translate(-50%,-150%); } }

  #over { background:rgba(13,11,38,.82); }
  .stat { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .stat div { background:var(--cream); border-radius:12px; padding:6px 2px; font:700 22px Fredoka, sans-serif; }
  .stat small { display:block; font:800 11px Nunito, sans-serif; opacity:.7; }
  .kb { margin-top:12px; display:grid; gap:4px; }
  .kb .r { display:flex; justify-content:center; gap:4px; }
  .kb span { width:clamp(22px, 7vw, 36px); height:clamp(24px, 4.5vh, 34px); border:2px solid var(--ink); border-radius:7px; display:flex; align-items:center; justify-content:center; font:800 13px Nunito, sans-serif; text-transform:uppercase; }
  .kbt { margin-top:10px; font-weight:900; font-size:14px; }
  .btns { margin-top:12px; display:flex; gap:8px; } .btns button { flex:1; min-height:48px; padding:12px; border-radius:14px; font-weight:900; font-size:16px; }
</style>
<link rel="stylesheet" href="/games/_shared/theme.css">
</head>
<body>
<div id="menu" class="screen">
  <div class="card nb">
    <h1>Pahlawan <span>Ketik</span> ⌨️</h1>
    <div class="sub">Monster menyerang sekolah! Ketik kata pada monster untuk menembaknya.</div>
    <div class="row"><span class="lbl">Isi</span>
      <div class="seg" id="segMode"><button class="nb-sm press" data-n="kata">🔤 Kata</button><button class="nb-sm press" data-n="angka">🔢 Angka</button></div></div>
    <div class="row"><span class="lbl">Tingkat</span>
      <div class="seg" id="segLevel"><button class="nb-sm press" data-n="1">Mudah</button><button class="nb-sm press" data-n="2">Sedang</button><button class="nb-sm press" data-n="3">Sulit</button></div></div>
    <div class="row"><span class="lbl">Tempo</span>
      <div class="seg" id="segTempo"><button class="nb-sm press" data-n="0.65">🐢 Lambat</button><button class="nb-sm press" data-n="1">🚶 Sedang</button><button class="nb-sm press" data-n="1.4">🚀 Cepat</button></div></div>
    <div class="best" id="best"></div>
    <div id="err" class="hidden"></div>
    <button id="start" class="nb press">🚀 MULAI</button>
  </div>
</div>

<div id="game" class="hidden">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="labels"></div>
    <div class="hud">
      <span class="pill" id="hScore">0</span>
      <span class="pill" id="hWave">Gelombang 1/10</span>
      <span class="pill" id="hLife">❤️❤️❤️</span>
      <span class="pill combo hidden" id="hCombo"></span>
      <span class="sp"></span>
      <span class="pill" id="hWpm">0 kpm</span>
      <button id="bMute" class="press" aria-label="Suara">🔊</button>
      <button id="bExit" class="press" aria-label="Selesai">✖</button>
    </div>
  </div>
  <div class="bar"><input id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ketik di sini…" aria-label="Ketik kata"></div>
</div>

<div id="over" class="screen hidden">
  <div class="card nb">
    <h1 id="oTitle">Selesai!</h1>
    <div class="stat">
      <div><span id="oScore">0</span><small>Skor</small></div>
      <div><span id="oWpm">0</span><small>Kata/menit</small></div>
      <div><span id="oAcc">0%</span><small>Akurasi</small></div>
      <div><span id="oWave">1</span><small>Gelombang</small></div>
    </div>
    <div class="kbt" id="oKbt">Tombol yang paling sering salah</div>
    <div class="kb" id="kb"></div>
    <div class="btns"><button id="again" class="nb press" style="background:var(--pink)">🔄 Main Lagi</button><button id="toMenu" class="nb press" style="background:var(--yellow)">🏠 Menu</button></div>
  </div>
</div>

<script src="/games/_shared/mathgen.js"></script>
<script src="/games/_shared/sfx.js"></script>
<script src="/games/_shared/suara.js"></script>
<script src="/games/_shared/tutor.js"></script>
<script src="/games/_shared/koin.js"></script>
<script src="/games/_shared/fx.js"></script>
<script type="module">
import * as THREE from '/games/_shared/three.module.min.js';
const $ = (id) => document.getElementById(id);
const WORDS = {
    kata: {
      1: 'buku pena meja tas topi bola ikan ayam sapi kuda nasi roti susu teh gula air api batu kayu daun bunga pohon padi rumah pintu kaca lampu jam bulan awan hujan angin laut gigi mata kaki jari ibu ayah adik guru kelas apel jeruk'.split(' '),
      2: 'sekolah belajar membaca menulis bermain sepeda kancil gajah harimau pelangi matahari sawah petani nelayan pasar jendela lemari pensil penggaris bendera garuda gunung sungai danau pantai hutan cuaca tanaman hewan sayuran olahraga upacara kantin halaman'.split(' '),
      3: 'perpustakaan kemerdekaan proklamasi musyawarah kebudayaan keberagaman persatuan lingkungan pelestarian pendidikan matematika kesehatan kebersihan kejujuran tanggungjawab nusantara kepulauan perjuangan pahlawan'.split(' ')
    },
};
const KALIMAT = {
  1: ['aku suka buku', 'ibu ke pasar', 'adik minum susu', 'ayo ke sekolah', 'kucing tidur', 'aku sayang ibu'],
  2: ['kami belajar bersama', 'ayo jaga kebersihan', 'buang sampah di tempatnya', 'aku rajin membaca', 'guru kami baik hati'],
  3: ['rajin belajar pangkal pandai', 'hemat pangkal kaya', 'bersatu kita teguh', 'kebersihan sebagian dari iman', 'jagalah lingkungan sekolah']
};
let mode = 'kata', level = 1, tempo = 1;
try { mode = localStorage.getItem('pk_mode') === 'angka' ? 'angka' : 'kata'; level = +localStorage.getItem('pk_level') || 1; tempo = +localStorage.getItem('tempo_pahlawan-ketik') || 1; } catch (e) {}

function seg(id, fn, isOn) {
  const el = $(id);
  const mark = () => { [...el.children].forEach((b) => b.classList.toggle('on', isOn(b.dataset.n))); showBest(); };
  el.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; fn(b.dataset.n); mark(); Sfx.click(); });
  mark();
}
const bestKey = () => 'pk_best_' + mode + level;
const getBest = () => { try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } };
function showBest() { const b = getBest(); $('best').textContent = b ? '🏆 Rekor kamu: ' + b : ''; }
seg('segMode', (n) => { mode = n; }, (n) => n === mode);
seg('segLevel', (n) => { level = +n; }, (n) => +n === level);
seg('segTempo', (n) => { tempo = +n; try { localStorage.setItem('tempo_pahlawan-ketik', n); } catch (e) {} }, (n) => +n === tempo);

// ================= 3D =================
const cv = $('cv');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); }
catch (e) { $('err').textContent = 'Perangkat ini belum mendukung grafik 3D. Coba buka di Chrome terbaru.'; $('err').classList.remove('hidden'); $('start').disabled = true; $('start').style.opacity = .5; }
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b26);
scene.fog = new THREE.Fog(0x1a1550, 90, 200);
const camera = new THREE.PerspectiveCamera(55, 1, 0.3, 300);
const CAM = new THREE.Vector3(15, 5, 31);
scene.add(new THREE.HemisphereLight(0x9fb4ff, 0x203018, 0.9));
const moonLight = new THREE.DirectionalLight(0xfff0d0, 1.4); moonLight.position.set(20, 30, 10); scene.add(moonLight);
const rim = new THREE.PointLight(0x66ccff, 30, 40); rim.position.set(0, 6, 8); scene.add(rim);

const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .7, metalness: .05 }, o));
// tanah & langit
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), M(0x1f4a2c)); ground.rotation.x = -Math.PI / 2; scene.add(ground);
{
  const n = 900, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, b = Math.random() * Math.PI * .45, r = 160; p[i * 3] = Math.cos(a) * Math.cos(b) * r; p[i * 3 + 1] = Math.sin(b) * r + 5; p[i * 3 + 2] = Math.sin(a) * Math.cos(b) * r - 40; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.1, fog: false })));
  const moon = new THREE.Mesh(new THREE.SphereGeometry(7, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe7a8, fog: false })); moon.position.set(-60, 95, -90); scene.add(moon);
  // pohon & bukit
  {
    const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(.3, .4, 2, 6), M(0x6b4423), 40);
    const leaves = new THREE.InstancedMesh(new THREE.ConeGeometry(1.8, 4, 7), M(0x2f7d46, { flatShading: true }), 40);
    const o = new THREE.Object3D();
    for (let i = 0; i < 40; i++) {
      const x = (Math.random() < .5 ? -1 : 1) * (18 + Math.random() * 40), z = -Math.random() * 90 + 10, k = .8 + Math.random() * .8;
      o.scale.setScalar(k); o.position.set(x, k, z); o.updateMatrix(); trunks.setMatrixAt(i, o.matrix);
      o.position.set(x, 3.8 * k, z); o.updateMatrix(); leaves.setMatrixAt(i, o.matrix);
    }
    scene.add(trunks, leaves);
  }
  for (let i = 0; i < 6; i++) { const h = new THREE.Mesh(new THREE.SphereGeometry(30, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), M(0x24563a, { flatShading: true })); h.position.set(-120 + i * 48, -8, -150); h.scale.y = .5; scene.add(h); }
}
// sekolah
const SCHOOL = new THREE.Vector3(0, 0, 9);
{
  const g = new THREE.Group(); g.position.copy(SCHOOL); g.rotation.y = Math.PI - .5;
  const body = new THREE.Mesh(new THREE.BoxGeometry(14, 4.5, 5), M(0xfff1cf)); body.position.y = 2.25; g.add(body);
  const roof = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 15, 3), M(0xff7a1a, { flatShading: true })); roof.rotation.z = Math.PI / 2; roof.rotation.y = 0; roof.scale.set(1, 1, 1); roof.position.y = 5.6; roof.rotation.x = Math.PI / 2; g.add(roof);
  const winM = new THREE.MeshStandardMaterial({ color: 0xffd66b, emissive: 0xffc23a, emissiveIntensity: 1 });
  for (let i = -2; i <= 2; i++) { if (!i) continue; const w = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.3), winM); w.position.set(i * 2.6, 2.6, -2.52); w.rotation.y = Math.PI; g.add(w); }
  const door = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 2.6), M(0x8a4b2a)); door.position.set(0, 1.3, -2.52); door.rotation.y = Math.PI; g.add(door);
  const c = document.createElement('canvas'); c.width = 512; c.height = 96; const x = c.getContext('2d');
  x.fillStyle = '#ffd23f'; x.fillRect(0, 0, 512, 96); x.strokeStyle = '#1b1a3a'; x.lineWidth = 10; x.strokeRect(0, 0, 512, 96);
  x.fillStyle = '#1b1a3a'; x.font = '700 60px Fredoka, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('SD MAIN-YUK', 256, 52);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.1), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) })); sign.position.set(0, 4, -2.56); sign.rotation.y = Math.PI; g.add(sign);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, 7), M(0xdddddd)); pole.position.set(-8.5, 3.5, -2); g.add(pole);
  const flag = new THREE.Group(); flag.position.set(-8.5, 6.4, -2);
  const fr = new THREE.Mesh(new THREE.PlaneGeometry(1.6, .5), new THREE.MeshBasicMaterial({ color: 0xe8202a, side: THREE.DoubleSide })); fr.position.set(.8, .25, 0); flag.add(fr);
  const fw = new THREE.Mesh(new THREE.PlaneGeometry(1.6, .5), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })); fw.position.set(.8, -.25, 0); flag.add(fw);
  g.add(flag); g.userData.flag = flag;
  scene.add(g); scene.userData.school = g;
}
// kubah perisai
const DOME_R = 10.5;
const domeMat = new THREE.MeshStandardMaterial({ color: 0x66d9ff, emissive: 0x2299ff, emissiveIntensity: .6, transparent: true, opacity: .2, side: THREE.DoubleSide, depthWrite: false });
const dome = new THREE.Mesh(new THREE.SphereGeometry(DOME_R, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2), domeMat); dome.position.copy(SCHOOL); scene.add(dome);
const domeWire = new THREE.Mesh(new THREE.SphereGeometry(DOME_R + .02, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x9be8ff, wireframe: true, transparent: true, opacity: .18 })); domeWire.position.copy(SCHOOL); scene.add(domeWire);
// roket
const rocket = new THREE.Group(); rocket.position.set(0, 12, 9); rocket.scale.setScalar(.75);
const rBody = new THREE.Group(); rocket.add(rBody); // menghadap -z lewat rotasi x
{
  const b = new THREE.Mesh(new THREE.CylinderGeometry(.55, .65, 2.4, 16), M(0xffffff, { metalness: .3, roughness: .4 })); rBody.add(b);
  const n = new THREE.Mesh(new THREE.ConeGeometry(.55, 1.2, 16), M(0xff5d8f)); n.position.y = 1.8; rBody.add(n);
  const w = new THREE.Mesh(new THREE.SphereGeometry(.28, 12, 8), M(0x4aa8ff, { emissive: 0x1d5fa8, emissiveIntensity: .8 })); w.position.set(0, .4, .55); rBody.add(w);
  for (let i = 0; i < 3; i++) { const f = new THREE.Mesh(new THREE.BoxGeometry(.1, .9, .7), M(0xff5d8f)); const a = i / 3 * Math.PI * 2; f.position.set(Math.sin(a) * .65, -.9, Math.cos(a) * .65); f.rotation.y = a; rBody.add(f); }
  const fl = new THREE.Mesh(new THREE.ConeGeometry(.4, 1.3, 12), new THREE.MeshBasicMaterial({ color: 0xffa31a, transparent: true, opacity: .9 })); fl.rotation.x = Math.PI; fl.position.y = -1.85; rBody.add(fl); rBody.userData.flame = fl;
  rBody.rotation.x = Math.PI / 2;
}
scene.add(rocket);

const COLORS = [0xff5d8f, 0x4aa8ff, 0x2ec4b6, 0xffd23f, 0xff7a1a, 0xb79cff, 0x8cf0b8];
const eyeW = M(0xffffff, { roughness: .3 }), eyeB = M(0x1b1a3a, { roughness: .2 });
const geoBody = new THREE.SphereGeometry(1, 24, 16), geoEye = new THREE.SphereGeometry(.28, 12, 8), geoPup = new THREE.SphereGeometry(.13, 10, 6), geoTen = new THREE.CapsuleGeometry(.16, .9, 4, 8);
function makeMonster(col, boss) {
  const g = new THREE.Group();
  const mat = M(col, { roughness: .45, emissive: col, emissiveIntensity: .35 });
  const body = new THREE.Mesh(geoBody, mat); body.scale.set(1, .92, 1); g.add(body);
  const ten = [];
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; const t = new THREE.Mesh(geoTen, mat); const piv = new THREE.Group(); piv.position.set(Math.sin(a) * .55, -.65, Math.cos(a) * .55); t.position.y = -.5; piv.add(t); piv.userData.a = a; g.add(piv); ten.push(piv); }
  [-1, 1].forEach((s) => { const e = new THREE.Mesh(geoEye, eyeW); e.position.set(s * .36, .22, .82); g.add(e); const p = new THREE.Mesh(geoPup, eyeB); p.position.set(s * .36, .22, 1.06); g.add(p); });
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(.25, .06, 6, 12, Math.PI), eyeB); mouth.position.set(0, -.18, .9); mouth.rotation.z = Math.PI; g.add(mouth);
  [-1, 1].forEach((s) => { const h = new THREE.Mesh(new THREE.ConeGeometry(.14, .5, 8), mat); h.position.set(s * .5, .95, 0); h.rotation.z = -s * .4; g.add(h); });
  if (boss) {
    const cm = M(0xffd23f, { metalness: .6, roughness: .3, emissive: 0x6b4a00, emissiveIntensity: .4 });
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, .3, 16, 1, true), cm); ring.position.y = 1.05; g.add(ring);
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; const sp = new THREE.Mesh(new THREE.ConeGeometry(.14, .45, 6), cm); sp.position.set(Math.sin(a) * .6, 1.4, Math.cos(a) * .6); g.add(sp); }
  }
  g.userData = { ten, mat };
  return g;
}

// partikel ledakan
const bursts = [];
function burst(pos, col, n) {
  const p = new Float32Array(n * 3), v = [];
  for (let i = 0; i < n; i++) { p[i * 3] = pos.x; p[i * 3 + 1] = pos.y; p[i * 3 + 2] = pos.z; const d = new THREE.Vector3(Math.random() - .5, Math.random() - .3, Math.random() - .5).normalize().multiplyScalar(6 + Math.random() * 14); v.push(d); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ color: col, size: .55, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const pts = new THREE.Points(g, m); scene.add(pts);
  const ring = new THREE.Mesh(new THREE.RingGeometry(.5, .9, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, side: THREE.DoubleSide, depthWrite: false })); ring.position.copy(pos); ring.lookAt(camera.position); scene.add(ring);
  bursts.push({ pts, v, life: 1, ring });
}
const lasers = [];
function laser(to) {
  const from = new THREE.Vector3(0, 1.8, 0).applyMatrix4(rBody.matrixWorld);
  const g = new THREE.BufferGeometry().setFromPoints([from, to.clone()]);
  const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffe14d, transparent: true, blending: THREE.AdditiveBlending }));
  scene.add(l); lasers.push({ l, life: .14 });
  const s = new THREE.Mesh(new THREE.SphereGeometry(.35, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true })); s.position.copy(to); scene.add(s); lasers.push({ l: s, life: .1 });
}

// ================= game =================
const labels = $('labels');
let enemies = [], target = null, score = 0, lives = 3, combo = 0, wave = 1, toSpawn = 0, spawnT = 0, running = false, raf = 0, last = 0;
let typed = 0, wrong = 0, words = 0, startAt = 0, shake = 0, miss = {}, waveBreak = 0, lookX = 0;
const WAVES = 10;

function pickWord(boss) {
  const used = enemies.map((e) => e.word[0]);
  if (mode === 'angka') {
    let r, tries = 0;
    do {
      const lv = boss ? 3 : Math.min(3, level + (wave >= 8 ? 1 : 0));
      const ops = lv === 1 ? ['add', 'sub'] : ['add', 'sub', 'mul', 'div'];
      const m = MathGen.make(ops[Math.floor(Math.random() * ops.length)], lv);
      r = { w: String(m.o[m.a]).replace(/\s/g, ''), clue: m.q.replace(' = ?', ' = ?') }; tries++;
    } while (tries < 20 && (used.indexOf(r.w[0]) >= 0 || !/^-?\d+$/.test(r.w)));
    if (!/^-?\d+$/.test(r.w)) { const a = 1 + Math.floor(Math.random() * 9), b = 1 + Math.floor(Math.random() * 9); r = { w: String(a + b), clue: a + ' + ' + b + ' = ?' }; }
    return r;
  }
  const useK = boss || wave >= 8;
  const list = useK ? KALIMAT[level] : (WORDS.kata[Math.min(3, level + (wave >= 6 ? 1 : 0))] || WORDS.kata[level]);
  let w, tries = 0;
  do { w = list[Math.floor(Math.random() * list.length)]; tries++; } while (tries < 20 && used.indexOf(w[0]) >= 0);
  return { w };
}

function spawn(boss) {
  const p = pickWord(boss);
  const half = camera.aspect < 1 ? 11 : 22;
  const mesh = makeMonster(boss ? 0xff3d6e : COLORS[Math.floor(Math.random() * COLORS.length)], boss);
  const sc = boss ? 3.4 : 1.6 + Math.random() * .3;
  mesh.scale.setScalar(sc);
  const pos = new THREE.Vector3((Math.random() * 2 - 1) * half * 1.3, 48 + Math.random() * 14, -55 + Math.random() * 30);
  if (boss) pos.set(0, 62, -40);
  mesh.position.copy(pos); scene.add(mesh);
  const el = document.createElement('div'); el.className = 'lb' + (boss ? ' boss' : ''); labels.appendChild(el);
  const e = { word: p.w, clue: p.clue, hit: 0, boss, mesh, el, sc, base: pos.clone(), t: 0, ph: Math.random() * 6.28, hurt: 0,
    spd: (boss ? 2.4 : 3.6 + level * .7 + wave * .32) * tempo, hp: boss ? 1 : 1 };
  drawLabel(e); enemies.push(e);
}
function esc(s) { return s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function drawLabel(e) {
  const hide = mode === 'angka';
  const done = esc(e.word.slice(0, e.hit)), rest = hide ? '?'.repeat(e.word.length - e.hit) : esc(e.word.slice(e.hit));
  e.el.innerHTML = (e.clue ? '<span class="clue">' + esc(e.clue) + '</span>' : '') + '<i>' + done + '</i>' + rest.replace(/ /g, '&nbsp;');
  e.el.classList.toggle('t', e === target); e.w = 0;
}
function removeEnemy(e) { scene.remove(e.mesh); e.el.remove(); enemies = enemies.filter((x) => x !== e); }

function banner(t) { const b = document.createElement('div'); b.className = 'banner'; b.textContent = t; $('stage').appendChild(b); setTimeout(() => b.remove(), 1700); }
function popText(pos, t) {
  const v = pos.clone().project(camera), r = cv.getBoundingClientRect();
  const d = document.createElement('div'); d.className = 'pop'; d.textContent = t; d.style.left = ((v.x + 1) / 2 * r.width) + 'px'; d.style.top = ((1 - v.y) / 2 * r.height) + 'px';
  $('stage').appendChild(d); setTimeout(() => d.remove(), 1000);
}
function startWave() {
  toSpawn = 3 + wave + Math.floor(wave / 2); spawnT = 700;
  const boss = wave === 5 || wave === WAVES;
  banner(boss ? '👾 BOS DATANG!' : wave >= 8 ? 'Gelombang ' + wave + ': kalimat!' : 'Gelombang ' + wave);
  if (boss) { toSpawn = Math.max(2, toSpawn - 3); setTimeout(() => { if (running) spawn(true); }, 1000); }
  $('hWave').textContent = 'Gelombang ' + wave + '/' + WAVES;
}

function key(ch) {
  if (window.Tutor && typed > 2) Tutor.done();
  if (!running || waveBreak > 0) return;
  ch = ch.toLowerCase();
  if (!target) {
    const cand = enemies.filter((e) => e.word[0] === ch).sort((a, b) => b.mesh.position.z - a.mesh.position.z);
    if (cand.length) { target = cand[0]; enemies.forEach(drawLabel); }
  }
  if (target && target.word[target.hit] === ch) {
    const e = target; e.hit++; typed++; e.hurt = 1; Sfx.click();
    laser(e.mesh.position);
    if (e.hit >= e.word.length) {
      target = null; words++; combo++;
      const mult = 1 + Math.floor(combo / 5), gain = e.word.replace(/ /g, '').length * 10 * mult * (e.boss ? 3 : 1);
      score += gain;
      const p = e.mesh.position.clone();
      burst(p, e.boss ? 0xffd23f : e.mesh.userData.mat.color.getHex(), e.boss ? 260 : 90);
      popText(p, '+' + gain); shake = e.boss ? 1.4 : .45; Sfx.pop();
      if (e.boss) { Sfx.win(); Fx.mascot('sorak'); }
      removeEnemy(e); enemies.forEach(drawLabel);
    } else drawLabel(e);
  } else {
    wrong++; combo = 0; Sfx.bad();
    const k = ch.length === 1 ? ch : '?'; miss[k] = (miss[k] || 0) + 1;
    shake = Math.max(shake, .1);
  }
  hud();
}
const inp = $('inp');
inp.addEventListener('input', () => { const v = inp.value; inp.value = ''; for (const c of v) if (c !== ' ' || (target && target.word[target.hit] === ' ')) key(c); });
inp.addEventListener('keydown', (e) => { if (e.key === 'Escape' || e.key === 'Backspace') { target = null; enemies.forEach(drawLabel); if (e.key === 'Backspace') e.preventDefault(); } });
$('stage').addEventListener('pointerdown', (e) => { if (!e.target.closest('button')) inp.focus(); });

function hud() {
  $('hScore').textContent = '⭐ ' + score;
  $('hLife').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
  const c = $('hCombo'); c.classList.toggle('hidden', combo < 3); c.textContent = '🔥 ' + combo + ' · x' + (1 + Math.floor(combo / 5));
  const min = Math.max(1 / 60, (performance.now() - startAt) / 60000); $('hWpm').textContent = Math.round(typed / 5 / min) + ' kpm';
}

function resize() {
  const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h || !renderer) return;
  renderer.setPixelRatio(Math.min(lowQ ? 1 : 1.5, window.devicePixelRatio || 1)); renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = camera.aspect < 1 ? 72 : 55; camera.updateProjectionMatrix();
  if (camera.aspect < 1) CAM.set(9, 4, 33); else CAM.set(15, 5, 31);
}
window.addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

const tmp = new THREE.Vector3(), look = new THREE.Vector3();
let lowQ = false, slowN = 0;
function frame(t) {
  if (!running) return;
  const dt = Math.min(.05, (t - (last || t)) / 1000); last = t;
  if (!lowQ && dt > .03 && ++slowN > 60) { lowQ = true; resize(); rim.visible = false; }
  if (waveBreak > 0) { waveBreak -= dt; if (waveBreak <= 0) { wave++; if (wave > WAVES) { end(true); return; } startWave(); } }
  else {
    spawnT -= dt * 1000;
    if (toSpawn > 0 && spawnT <= 0) { spawn(false); toSpawn--; spawnT = Math.max(900, 2700 - wave * 120 - level * 160) / tempo; }
    if (toSpawn <= 0 && !enemies.length) { waveBreak = 2.4; score += wave * 50; banner('Aman! +' + wave * 50); Sfx.coin && Sfx.coin(); hud(); }
  }
  // musuh
  for (const e of enemies.slice()) {
    e.t += dt;
    const p = e.mesh.position;
    const dir = tmp.set(SCHOOL.x - e.base.x, 9 - e.base.y, SCHOOL.z - e.base.z); const dist = dir.length(); dir.normalize();
    e.base.addScaledVector(dir, e.spd * dt);
    p.copy(e.base); p.x += Math.sin(e.t * 1.6 + e.ph) * (e.boss ? 2.5 : 1.6); p.y += Math.sin(e.t * 2.3 + e.ph) * .5;
    e.mesh.lookAt(camera.position);
    e.mesh.userData.ten.forEach((pv, i) => { pv.rotation.x = Math.sin(e.t * 6 + i) * .45; pv.rotation.z = Math.cos(e.t * 5 + i * 1.3) * .35; });
    e.hurt = Math.max(0, e.hurt - dt * 5);
    e.mesh.userData.mat.emissiveIntensity = .35 + e.hurt * .9;
    e.mesh.scale.setScalar(e.sc * (1 + e.hurt * .12));
    if (p.distanceTo(SCHOOL) < DOME_R + e.sc * .8 || dist < 2) {
      lives--; combo = 0; shake = 1.2; burst(p.clone(), 0xff5d8f, 120); Sfx.bad(); domeMat.opacity = .6;
      if (e === target) target = null;
      removeEnemy(e); hud();
      if (lives <= 0) { end(false); return; }
    }
  }
  // roket & kamera
  const goal = target ? target.mesh.position : look.set(0, 8, -40);
  rocket.lookAt(goal); rBody.userData.flame.scale.y = .8 + Math.random() * .5;
  rocket.position.y = 12 + Math.sin(t / 400) * .15;
  lookX += ((target ? target.mesh.position.x * .25 : 0) - lookX) * Math.min(1, dt * 3);
  camera.position.copy(CAM); camera.position.x += lookX * .4;
  if (shake > 0) { camera.position.x += (Math.random() - .5) * shake; camera.position.y += (Math.random() - .5) * shake; shake = Math.max(0, shake - dt * 2.5); }
  camera.lookAt(lookX - 2, camera.aspect < 1 ? 24 : 19, -18);
  domeMat.opacity += ((.1 + lives * .05) - domeMat.opacity) * Math.min(1, dt * 3);
  domeMat.color.setHex(lives <= 1 ? 0xff7a9a : 0x66d9ff);
  const fl = scene.userData.school.userData.flag; fl.children.forEach((c, i) => { c.rotation.y = Math.sin(t / 250 + i) * .3; });
  // efek
  for (const b of bursts.slice()) {
    b.life -= dt; const a = b.pts.geometry.attributes.position;
    for (let i = 0; i < b.v.length; i++) { a.array[i * 3] += b.v[i].x * dt; a.array[i * 3 + 1] += b.v[i].y * dt; a.array[i * 3 + 2] += b.v[i].z * dt; b.v[i].y -= 9 * dt; b.v[i].multiplyScalar(.97); }
    a.needsUpdate = true; b.pts.material.opacity = Math.max(0, b.life);
    b.ring.scale.setScalar(1 + (1 - b.life) * 8); b.ring.material.opacity = Math.max(0, b.life - .4);
    if (b.life <= 0) { scene.remove(b.pts); scene.remove(b.ring); b.pts.geometry.dispose(); bursts.splice(bursts.indexOf(b), 1); }
  }
  for (const l of lasers.slice()) { l.life -= dt; l.l.material.opacity = Math.max(0, l.life * 7); if (l.life <= 0) { scene.remove(l.l); lasers.splice(lasers.indexOf(l), 1); } }
  renderer.render(scene, camera);
  // label
  const r = { w: cv.clientWidth, h: cv.clientHeight }, placed = [];
  for (const e of enemies.slice().sort((a, b) => b.mesh.position.z - a.mesh.position.z)) {
    tmp.copy(e.mesh.position); tmp.y += e.sc * 1.25; tmp.project(camera);
    if (tmp.z > 1) { e.el.style.display = 'none'; continue; }
    e.el.style.display = '';
    if (!e.w) { e.w = e.el.offsetWidth; e.h = e.el.offsetHeight; }
    let sx = Math.max(e.w / 2 + 4, Math.min(r.w - e.w / 2 - 4, (tmp.x + 1) / 2 * r.w)), sy = Math.max(92 + e.h, (1 - tmp.y) / 2 * r.h);
    for (let k = 0; k < 6; k++) { const hit = placed.find((q) => Math.abs(q.x - sx) < (q.w + e.w) / 2 + 4 && Math.abs(q.y - sy) < (q.h + e.h) / 2 + 2); if (!hit) break; sy = hit.y - (hit.h + e.h) / 2 - 3; }
    placed.push({ x: sx, y: sy, w: e.w, h: e.h });
    const tr = 'translate(' + Math.round(sx) + 'px,' + Math.round(sy) + 'px) translate(-50%,-100%)';
    if (tr !== e.tr) { e.el.style.transform = tr; e.tr = tr; }
    e.el.style.zIndex = e === target ? 3 : 1 + Math.round((e.mesh.position.z + 80));
  }
  if (Math.floor(t / 500) !== Math.floor((t - dt * 1000) / 500)) hud();
  raf = requestAnimationFrame(frame);
}

function clearAll() { enemies.slice().forEach(removeEnemy); bursts.forEach((b) => { scene.remove(b.pts); scene.remove(b.ring); }); bursts.length = 0; lasers.forEach((l) => scene.remove(l.l)); lasers.length = 0; }
function start() {
  if (!renderer) return;
  if (window.Tutor) setTimeout(Tutor.hint, 1500);
  try { localStorage.setItem('pk_mode', mode); localStorage.setItem('pk_level', level); } catch (e) {}
  clearAll(); target = null; score = 0; lives = 3; combo = 0; wave = 1; typed = 0; wrong = 0; words = 0; miss = {}; waveBreak = 0; shake = 0; lookX = 0;
  $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('game').classList.remove('hidden');
  inp.setAttribute('inputmode', mode === 'angka' ? 'numeric' : 'text');
  inp.placeholder = mode === 'angka' ? 'ketik jawabannya…' : 'ketik kata…';
  $('bMute').textContent = Sfx.muted() ? '🔇' : '🔊';
  resize(); running = true; last = 0; startAt = performance.now(); hud(); startWave(); Sfx.go(); Sfx.music(true);
  raf = requestAnimationFrame(frame); setTimeout(() => inp.focus(), 60);
}
function end(win) {
  if (!running) return;
  if (window.Koin) setTimeout(() => Koin.add(score / 20, 'Pahlawan Ketik'), 400);
  running = false; cancelAnimationFrame(raf); Sfx.music(false);
  const min = Math.max(1 / 60, (performance.now() - startAt) / 60000), acc = typed + wrong ? Math.round(typed / (typed + wrong) * 100) : 0;
  const best = getBest(), rec = score > best; if (rec) try { localStorage.setItem(bestKey(), score); } catch (e) {}
  $('oScore').textContent = score; $('oWpm').textContent = Math.round(typed / 5 / min); $('oAcc').textContent = acc + '%'; $('oWave').textContent = Math.min(wave, WAVES);
  $('oTitle').textContent = win ? '🏆 Sekolah selamat!' : rec ? '🏆 Rekor baru!' : 'Perisai jebol!';
  const rows = mode === 'angka' ? ['1234567890'] : ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'], mx = Math.max(1, ...Object.values(miss));
  $('kb').innerHTML = rows.map((r) => '<div class="r">' + r.split('').map((c) => { const n = miss[c] || 0, a = n / mx; return '<span style="background:' + (n ? 'rgba(255,93,143,' + (.25 + a * .75) + ')' : '#fff') + '">' + c + '</span>'; }).join('') + '</div>').join('');
  const top = Object.keys(miss).filter((k) => /[a-z0-9]/.test(k)).sort((a, b) => miss[b] - miss[a]).slice(0, 3);
  $('oKbt').textContent = top.length ? 'Paling sering salah: ' + top.map((k) => k.toUpperCase()).join(', ') : 'Hebat, hampir tanpa salah ketik!';
  $('over').classList.remove('hidden');
  if (win || rec) { Sfx.win(); Fx.win(); } else Fx.mascot('sedih');
}
$('start').addEventListener('click', start);
$('again').addEventListener('click', start);
$('toMenu').addEventListener('click', () => { clearAll(); $('over').classList.add('hidden'); $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); showBest(); });
$('bExit').addEventListener('click', () => { if (confirm('Selesai bermain?')) end(false); });
$('bMute').addEventListener('click', function () { try { localStorage.setItem('bgy_muted', Sfx.muted() ? '0' : '1'); } catch (e) {} this.textContent = Sfx.muted() ? '🔇' : '🔊'; Sfx.music(!Sfx.muted() && running); });
document.addEventListener('visibilitychange', () => { last = 0; });
window.__pk = { key, state: () => ({ wave, lives, score, n: enemies.length, words: enemies.map((e) => e.word), running }) };
if (window.Tutor) Tutor.init('pahlawan-ketik', [{ sel: '#segMode', text: 'Pilih isi: Kata atau Angka.' }, { sel: '#segTempo', text: 'Atur kecepatan monster.' }, { sel: '#start', text: 'Tekan MULAI. Ketik kata pada monster untuk menembak.' }], { inGame: 'Ketik huruf pertama untuk mengunci monster.' });
</script>
