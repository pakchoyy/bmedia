<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Misi Selamatkan Desa · Main-yuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b1a3a; --cream:#fff6dc; --yellow:#ffd23f; --orange:#ff7a1a; --pink:#ff5d8f; --mint:#2ec4b6; --blue:#4aa8ff; --green:#22c55e; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#6fb7d8; color:var(--ink); font-family:Nunito, sans-serif; touch-action:manipulation; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .hidden { display:none !important; }
  .nb { border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); }
  .nb-sm { border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .press:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }

  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1; min-height:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #pads { flex:none; display:grid; gap:0; border-top:3px solid var(--ink); background:var(--ink); }

  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:12px; overflow:auto; z-index:20; }
  #menu { background:linear-gradient(160deg, rgba(74,168,255,.6), rgba(46,196,182,.6)); }
  .card { background:#fff; border-radius:22px; padding:16px 20px; width:min(100%, 640px); text-align:center; margin:auto; }
  .card h1 { font:700 clamp(26px, 5.5vh, 42px)/1.05 Fredoka, sans-serif; }
  .card h1 span { color:#1e9be0; }
  .sub { font-size:15px; font-weight:700; opacity:.8; margin-top:6px; }
  .row { margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .lbl { font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; min-width:64px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .seg button { min-height:44px; padding:8px 13px; border-radius:12px; font-weight:900; font-size:15px; background:#fff; }
  .seg button.on { background:var(--yellow); }
  .names { margin-top:10px; display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:8px; }
  .nm { display:flex; align-items:center; gap:6px; }
  .nm .dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--ink); flex:none; }
  .nm input { flex:1; min-width:0; min-height:44px; font:inherit; font-weight:800; border:2px solid var(--ink); border-radius:10px; padding:6px 10px; }
  .nm .ch { width:48px; height:48px; border-radius:12px; background:var(--cream); flex:none; display:grid; place-items:center; overflow:hidden; }
  .nm .ch img { height:44px; }
  #start { margin-top:12px; width:100%; min-height:52px; padding:12px; border-radius:16px; background:#1e9be0; font:700 22px Fredoka, sans-serif; color:#fff; text-shadow:2px 2px 0 var(--ink); }

  .topbar { position:absolute; top:6px; left:8px; right:8px; display:flex; gap:6px; align-items:center; z-index:5; pointer-events:none; }
  .pill { background:#fff; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); border-radius:99px; padding:3px 12px; font:800 14px Nunito, sans-serif; white-space:nowrap; }
  .topbar .sp { flex:1; }
  .topbar button { pointer-events:auto; background:#fff; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); border-radius:99px; width:40px; height:40px; font-size:16px; }
  .banner { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); z-index:6; font:700 clamp(30px, 9vh, 72px) Fredoka, sans-serif; color:#fff; text-shadow:4px 4px 0 var(--ink); pointer-events:none; white-space:nowrap; animation:bn 1.6s ease forwards; }
  @keyframes bn { 0% { opacity:0; transform:translate(-50%,-50%) scale(.5); } 20% { opacity:1; transform:translate(-50%,-50%) scale(1.1); } 80% { opacity:1; } 100% { opacity:0; } }

  /* panel pemain */
  .pad { background:#fff; border-right:3px solid var(--ink); display:flex; flex-direction:column; min-width:0; position:relative; }
  .pad:last-child { border-right:0; }
  .pad header { background:var(--c); border-bottom:3px solid var(--ink); display:flex; align-items:center; gap:6px; padding:3px 8px; font-weight:900; font-size:clamp(12px, 2vh, 16px); }
  .pad header .nmx { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pad header .kh { font-size:11px; opacity:.7; }
  .pad .sc { background:#fff; border:2px solid var(--ink); border-radius:99px; padding:0 8px; }
  .pad .clean { height:7px; background:#d6e4ee; }
  .pad .clean i { display:block; height:100%; width:100%; background:linear-gradient(90deg, #4aa8ff, #22c55e); transition:width .3s; }
  .pad .body { flex:1; display:grid; grid-template-columns:1fr auto 1fr; gap:6px; padding:6px; align-items:stretch; min-height:0; }
  .pad .cur { width:clamp(54px, 11vh, 96px); display:grid; place-items:center; border-radius:14px; background:#eaf6ff; border:2px dashed #9cc9e8; }
  .pad .cur img { max-width:90%; max-height:90%; }
  .pad .cur.ready { background:#fff3c4; border:3px solid var(--orange); animation:pulse .6s ease infinite alternate; }
  @keyframes pulse { to { transform:scale(1.06); } }
  .pad .bt { border-radius:16px; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font:900 clamp(13px, 2.2vh, 18px) Nunito, sans-serif; }
  .pad .bt img { height:clamp(30px, 8vh, 72px); pointer-events:none; }
  .pad .bt.org { background:#c8f7d6; } .pad .bt.ano { background:#cfe8ff; }
  .pad .msg { position:absolute; left:6px; right:6px; bottom:6px; background:#ffe0e6; border:2px solid var(--ink); border-radius:12px; padding:4px 8px; font-weight:900; font-size:clamp(11px, 1.8vh, 14px); text-align:center; pointer-events:none; }
  .pad.frozen .body { opacity:.45; animation:shk .35s; }
  .pad.good .cur { background:#c8f7dc; }
  @keyframes shk { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
  .pad.win { background:var(--yellow); }
  @media (min-width:900px) and (pointer:fine) { .pad header .kh { display:inline; } }
  @media (max-width:899px), (pointer:coarse) { .pad header .kh { display:none; } }

  #result { background:rgba(27,26,58,.6); }
  .rank { margin-top:10px; display:grid; gap:6px; }
  .rank div { display:flex; align-items:center; gap:10px; background:var(--cream); border-radius:12px; padding:6px 12px; font-weight:900; text-align:left; }
  .rank b { font:700 22px Fredoka, sans-serif; width:30px; }
  .rank span { flex:1; } .rank small { opacity:.7; font-weight:800; }
  .wbtns { margin-top:14px; display:flex; gap:8px; } .wbtns button { flex:1; min-height:50px; border-radius:14px; font-weight:900; font-size:16px; }
</style>
<link rel="stylesheet" href="/games/_shared/theme.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="topbar hidden" id="topbar">
      <span class="pill" id="hTarget">Target 15</span>
      <span class="sp"></span>
      <button id="bMute" aria-label="Suara">🔊</button>
      <button id="bExit" aria-label="Selesai">✖</button>
    </div>
  </div>
  <div id="pads" class="hidden"></div>
</div>

<div id="menu" class="screen">
  <div class="card nb">
    <h1>Misi Selamatkan <span>Desa</span> 🌊</h1>
    <div class="sub">Hujan membuat sampah hanyut di sungai. Siapa paling cepat memilah sampah?</div>
    <div class="row"><span class="lbl">Pemain</span>
      <div class="seg" id="segPlayers"><button class="nb-sm press" data-n="1">1 vs 🤖</button><button class="nb-sm press" data-n="2">2</button><button class="nb-sm press" data-n="3">3</button><button class="nb-sm press" data-n="4">4</button></div></div>
    <div class="names" id="names"></div>
    <div class="row"><span class="lbl">Tingkat</span>
      <div class="seg" id="segLevel"><button class="nb-sm press" data-n="1">Mudah</button><button class="nb-sm press" data-n="2">Sedang</button><button class="nb-sm press" data-n="3">Sulit</button></div></div>
    <div class="row"><span class="lbl">Tempo</span>
      <div class="seg" id="segTempo"><button class="nb-sm press" data-n="0.7">🐢 Lambat</button><button class="nb-sm press" data-n="1">🚶 Sedang</button><button class="nb-sm press" data-n="1.35">🚀 Cepat</button></div></div>
    <div class="row"><span class="lbl">Target</span>
      <div class="seg" id="segTarget"><button class="nb-sm press" data-n="10">10 sampah</button><button class="nb-sm press" data-n="15">15</button><button class="nb-sm press" data-n="20">20</button></div></div>
    <div class="row"><span class="lbl">Grafik</span>
      <div class="seg" id="segGfx"><button class="nb-sm press" data-n="bagus">✨ Bagus</button><button class="nb-sm press" data-n="ringan">⚡ Ringan</button></div></div>
    <button id="start" class="nb press">▶ MULAI</button>
  </div>
</div>

<div id="result" class="screen hidden">
  <div class="card nb">
    <h1 id="rTitle">Sungai bersih! 🎉</h1>
    <div class="sub" id="rSub"></div>
    <div class="rank" id="rank"></div>
    <div class="wbtns"><button id="again" class="nb press" style="background:#1e9be0;color:#fff">🔄 Main lagi</button><button id="toMenu" class="nb press" style="background:var(--yellow)">🏠 Menu</button></div>
  </div>
</div>

<script src="/games/_shared/sfx.js"></script>
<script src="/games/_shared/dialog.js"></script>
<script src="/games/_shared/suara.js"></script>
<script src="/games/_shared/tutor.js"></script>
<script src="/games/_shared/koin.js"></script>
<script src="/games/_shared/fx.js"></script>
<script type="module" src="game.js"></script>
<script src="/games/_shared/twemoji.min.js"></script>
<script src="/games/_shared/emoji.js"></script>
</body>
</html>
