<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Susun Kata · Main-yuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b1a3a; --cream:#fff6dc; --yellow:#ffd23f; --orange:#ff7a1a; --pink:#ff5d8f; --mint:#2ec4b6; --blue:#4aa8ff; --lilac:#b79cff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; color:var(--ink);
    font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif; touch-action:manipulation;
    background:var(--cream) radial-gradient(rgba(27,26,58,.08) 1.5px, transparent 1.5px) 0 0 / 18px 18px; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .hidden { display:none !important; }
  .nb { border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); }
  .nb-sm { border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .press:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:10px; overflow:auto; }
  .card { background:#fff; border-radius:22px; padding:16px 20px; width:min(100%, 600px); text-align:center; }
  .card h1 { font-size:clamp(26px, 5.5vh, 42px); line-height:1.05; font-weight:900; }
  .card h1 span { color:var(--pink); }
  .sub { font-size:13px; font-weight:700; opacity:.75; margin-top:4px; }
  .setinfo { margin-top:8px; font-size:12px; font-weight:800; background:#fff3c4; border:2px solid var(--ink); border-radius:10px; padding:3px 10px; display:inline-block; }
  .setinfo.ok { background:#c8f7dc; } .setinfo.err { background:#ffd6d6; }
  .row { margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .lbl { font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .seg button { padding:7px 13px; border-radius:12px; font-weight:900; font-size:15px; background:#fff; }
  .seg button.on { background:var(--yellow); }
  .off { opacity:.35; pointer-events:none; }
  #name { margin-top:10px; width:100%; font:inherit; font-weight:800; border:2px solid var(--ink); border-radius:10px; padding:8px 10px; }
  .big { margin-top:12px; width:100%; padding:12px; border-radius:16px; background:var(--orange); font-size:20px; font-weight:900; }

  #game { flex-direction:column; justify-content:flex-start; gap:clamp(8px, 2vh, 18px); padding:0 10px 10px; }
  .hud { width:100%; display:flex; align-items:center; gap:8px; padding:8px 0; font-weight:900; }
  .pill { background:#fff; border-radius:99px; padding:3px 12px; font-size:clamp(13px, 2.4vh, 18px); }
  .bar { flex:1; height:14px; background:#fff; border:2px solid var(--ink); border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; width:100%; background:var(--mint); transition:width .25s linear; }
  .bar i.low { background:var(--pink); }
  .hud button { background:#fff; border-radius:99px; width:34px; height:34px; }
  .clue { margin-top:auto; width:min(100%, 820px); background:#fff; border-radius:18px; padding:10px 14px; text-align:center; }
  .clue small { font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.7px; opacity:.6; }
  .clue p { font-weight:900; font-size:clamp(16px, 3.4vh, 28px); line-height:1.2; margin-top:2px; }
  .slots, .pool { display:flex; flex-wrap:wrap; justify-content:center; gap:clamp(5px, 1vw, 10px); width:min(100%, 900px); }
  .slot, .tile { width:clamp(38px, min(9vw, 10vh), 72px); aspect-ratio:1; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:clamp(20px, min(5vw, 6vh), 40px); text-transform:uppercase; }
  .slot { background:rgba(255,255,255,.6); border:3px dashed rgba(27,26,58,.35); }
  .slot.filled { background:#fff; border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); cursor:pointer; }
  .slot.space { visibility:hidden; width:clamp(12px, 2vw, 20px); }
  .slots.good .slot.filled { background:#8cf0b8; animation:bounce .5s; }
  .slots.bad { animation:shake .35s; } .slots.bad .slot.filled { background:#ff9aa8; }
  @keyframes bounce { 50% { transform:translateY(-8px); } }
  @keyframes shake { 25% { transform:translateX(-8px); } 75% { transform:translateX(8px); } }
  .tile { background:var(--c, var(--yellow)); border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); }
  .tile.used { visibility:hidden; }
  .tools { margin-bottom:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .tools button { background:#fff; border-radius:12px; padding:8px 14px; font-weight:900; font-size:clamp(13px, 2.4vh, 17px); }
  .toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); font-size:clamp(28px, 8vh, 64px); font-weight:900; pointer-events:none; animation:fade 1s forwards; z-index:9; text-shadow:3px 3px 0 #fff; }
  @keyframes fade { 0% { opacity:0; transform:translate(-50%,-30%) scale(.6); } 25% { opacity:1; transform:translate(-50%,-50%) scale(1.1); } 100% { opacity:0; transform:translate(-50%,-80%); } }
  .stat { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .stat div { background:var(--cream); border-radius:12px; padding:6px; font-weight:900; font-size:22px; }
  .stat small { display:block; font-size:11px; opacity:.7; }
  .btns { margin-top:12px; display:flex; gap:8px; } .btns button { flex:1; padding:12px; border-radius:14px; font-weight:900; font-size:16px; }
  #saved { margin-top:8px; font-size:13px; font-weight:800; }
  #saved a { color:inherit; }
  .review { margin-top:10px; max-height:30vh; overflow:auto; text-align:left; font-size:13px; font-weight:700; }
  .review div { padding:3px 6px; border-bottom:1px dashed rgba(27,26,58,.2); }
  @media (prefers-reduced-motion: reduce) { .slots.good .slot.filled, .slots.bad, .toast { animation:none; } }
</style>
<link rel="stylesheet" href="/games/_shared/theme.css">
</head>
<body>
<div id="menu" class="screen">
  <div class="card nb">
    <h1>Susun <span>Kata</span> 🔠</h1>
    <div class="sub">Huruf-hurufnya teracak! Ketuk huruf sesuai urutan untuk menyusun kata yang benar.</div>
    <div class="setinfo" id="setinfo">📚 Kata bawaan</div>
    <div class="row" id="rowTema"><span class="lbl">Tema</span>
      <div class="seg" id="segTema"><button class="nb-sm press" data-n="hewan">🐘 Hewan</button><button class="nb-sm press" data-n="buah">🍉 Buah</button><button class="nb-sm press" data-n="sekolah">🎒 Sekolah</button><button class="nb-sm press" data-n="ipa">🔬 IPA</button><button class="nb-sm press" data-n="acak">🎲 Acak</button></div></div>
    <div class="row"><span class="lbl">Waktu</span>
      <div class="seg" id="segTime"><button class="nb-sm press" data-n="60">1 menit</button><button class="nb-sm press" data-n="120">2 menit</button><button class="nb-sm press" data-n="0">Santai</button></div></div>
    <input id="name" maxlength="30" placeholder="Nama kamu (untuk skor kelas)" class="hidden" autocomplete="off">
    <button id="start" class="big nb press">▶ MULAI</button>
  </div>
</div>

<div id="game" class="screen hidden">
  <div class="hud">
    <span class="pill nb-sm" id="score">0</span>
    <span class="pill nb-sm" id="count">1</span>
    <div class="bar" id="barBox"><i id="bar"></i></div>
    <button class="nb-sm press" id="bMute" aria-label="Suara">🔊</button>
    <button class="nb-sm press" id="bExit" aria-label="Selesai">✖</button>
  </div>
  <div class="clue nb"><small id="clueLbl">Petunjuk</small><p id="clue"></p></div>
  <div class="slots" id="slots" aria-live="polite"></div>
  <div class="pool" id="pool"></div>
  <div class="tools">
    <button class="nb-sm press" id="bUndo">⌫ Hapus</button>
    <button class="nb-sm press" id="bShuffle">🔀 Acak</button>
    <button class="nb-sm press" id="bHint">💡 Bantuan (−20)</button>
    <button class="nb-sm press" id="bSkip">⏭ Lewati</button>
  </div>
</div>

<div id="over" class="screen hidden" style="background:rgba(27,26,58,.72)">
  <div class="card nb">
    <h1 id="ovTitle">Selesai!</h1>
    <div class="stat"><div><span id="oScore">0</span><small>Skor</small></div><div><span id="oRight">0</span><small>Kata benar</small></div><div><span id="oSkip">0</span><small>Dilewati</small></div></div>
    <div id="saved"></div>
    <div class="review" id="review"></div>
    <div class="btns"><button id="again" class="nb press" style="background:var(--orange)">🔄 Main Lagi</button><button id="toMenu" class="nb press" style="background:var(--yellow)">🏠 Menu</button></div>
  </div>
</div>

<script src="/games/_shared/sfx.js"></script>
<script src="/games/_shared/koin.js"></script>
<script src="/games/_shared/fx.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var BANK = {
    hewan: [['gajah','Hewan berbelalai panjang'],['jerapah','Hewan berleher paling panjang'],['kancil','Hewan cerdik dalam dongeng'],['harimau','Kucing besar bergaris hitam'],['kupu-kupu','Serangga bersayap indah, dulunya ulat'],['katak','Hewan amfibi yang melompat'],['kelinci','Hewan bertelinga panjang suka wortel'],['bebek','Unggas yang pandai berenang, bunyinya kwek'],['komodo','Kadal raksasa dari Nusa Tenggara Timur'],['lumba-lumba','Mamalia laut yang cerdas'],['semut','Serangga kecil yang hidup berkelompok'],['burung','Hewan bersayap dan berbulu']],
    buah: [['pisang','Buah panjang berwarna kuning'],['semangka','Buah besar, hijau di luar merah di dalam'],['durian','Raja buah yang berduri'],['mangga','Buah harum, manis, dan berwarna kuning jingga'],['jeruk','Buah bulat kaya vitamin C'],['salak','Buah berkulit seperti sisik ular'],['nanas','Buah bermahkota daun berduri'],['apel','Buah merah atau hijau yang renyah'],['rambutan','Buah berambut, manis dan berair'],['alpukat','Buah hijau lembut untuk jus']],
    sekolah: [['pensil','Alat tulis yang bisa dihapus'],['penghapus','Untuk menghapus tulisan pensil'],['penggaris','Untuk mengukur dan membuat garis lurus'],['buku','Tempat menulis catatan pelajaran'],['papan tulis','Tempat guru menulis di depan kelas'],['perpustakaan','Ruang tempat meminjam buku'],['upacara','Kegiatan hari Senin di lapangan'],['seragam','Pakaian yang sama dipakai ke sekolah'],['kantin','Tempat jajan di sekolah'],['bendera','Merah putih dikibarkan saat upacara']],
    ipa: [['matahari','Sumber energi utama bagi bumi'],['fotosintesis','Proses tumbuhan membuat makanan'],['magnet','Benda yang menarik besi'],['oksigen','Gas yang kita hirup untuk bernapas'],['akar','Bagian tumbuhan yang menyerap air'],['daun','Bagian tumbuhan tempat fotosintesis'],['planet','Bumi, Mars, dan Jupiter termasuk benda ini'],['hujan','Air yang turun dari awan'],['pelangi','Lengkung warna-warni setelah hujan'],['gravitasi','Gaya yang membuat benda jatuh ke bawah'],['kepompong','Tahap sebelum ulat menjadi kupu-kupu']]
  };
  var COLORS = ['#ffd23f', '#2ec4b6', '#ff7a1a', '#4aa8ff', '#ff5d8f', '#b79cff'];
  var tema = 'acak', timeLimit = 120, setQ = null, setCode = null;
  var queue = [], cur = null, picked = [], tiles = [], score = 0, right = 0, skipped = 0, num = 0, timeLeft = 0, timerId = 0, running = false, history = [], qstats = {}, startAt = 0, hintUsed = 0;
  var muted = false; try { muted = localStorage.getItem('bgy_muted') === '1'; } catch (e) {}
  var actx = null;
  function tone(f, t, d, type, v) { if (muted) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); var o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + t; o.type = type || 'sine'; o.frequency.setValueAtTime(f, s); g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(v || .12, s + .015); g.gain.exponentialRampToValueAtTime(.0001, s + d); o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + d + .02); } catch (e) {} }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function norm(s) { return s.toLowerCase().replace(/\s+/g, ' ').trim(); }

  // ---------- Soal guru: pertanyaan = petunjuk, jawaban benar = kata yang disusun ----------
  (function loadSet() {
    var code = (new URLSearchParams(location.search).get('set') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) return;
    var info = $('setinfo'); info.textContent = '⏳ Memuat soal dari guru...';
    fetch('/api/set/' + code).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }).then(function (d) {
      var qs = [];
      (Array.isArray(d.questions) ? d.questions : []).forEach(function (q, i) {
        if (!q || typeof q.q !== 'string' || !Array.isArray(q.o) || !(q.a >= 0 && q.a < q.o.length)) return;
        var w = norm(String(q.o[q.a]));
        // hanya jawaban pendek berupa huruf/angka/spasi/strip (maks 14 karakter, 2 kata)
        if (w.length >= 2 && w.length <= 14 && /^[a-z0-9\- ]+$/.test(w) && w.split(' ').length <= 2) qs.push({ w: w, clue: q.q, idx: i });
      });
      if (!qs.length) throw new Error('tidak cocok');
      setQ = qs; setCode = code;
      info.textContent = '📚 Soal guru: ' + d.title + ' (' + qs.length + ' kata)'; info.className = 'setinfo ok';
      $('rowTema').classList.add('off'); $('name').classList.remove('hidden');
      try { $('name').value = localStorage.getItem('bgy_name') || ''; } catch (e) {}
    }).catch(function (e) {
      info.textContent = e && e.message === 'tidak cocok' ? '⚠️ Jawaban soal guru terlalu panjang untuk disusun. Memakai kata bawaan.' : '⚠️ Kode soal tidak ditemukan. Memakai kata bawaan.';
      info.className = 'setinfo err';
    });
  })();

  function seg(id, fn, isOn) {
    var el = $(id);
    function mark() { [].forEach.call(el.children, function (b) { b.classList.toggle('on', isOn(b.dataset.n)); }); }
    el.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; fn(b.dataset.n); mark(); tone(600, 0, .06); });
    mark();
  }
  seg('segTema', function (n) { tema = n; }, function (n) { return n === tema; });
  seg('segTime', function (n) { timeLimit = +n; }, function (n) { return +n === timeLimit; });

  function buildQueue() {
    if (setQ) return shuffle(setQ.slice());
    var src = tema === 'acak' ? [].concat(BANK.hewan, BANK.buah, BANK.sekolah, BANK.ipa) : BANK[tema];
    return shuffle(src.map(function (x) { return { w: x[0], clue: x[1] }; }));
  }

  function nextWord() {
    if (!queue.length) queue = buildQueue();
    cur = queue.pop(); num++; picked = []; hintUsed = 0;
    $('count').textContent = '#' + num;
    $('clue').textContent = cur.clue;
    $('clueLbl').textContent = setQ ? 'Soal' : 'Petunjuk · ' + cur.w.replace(/[^a-z0-9]/g, '').length + ' huruf';
    var letters = cur.w.split('').filter(function (c) { return c !== ' ' && c !== '-'; });
    var mixed;
    do { mixed = shuffle(letters.slice()); } while (letters.length > 1 && mixed.join('') === letters.join(''));
    tiles = mixed.map(function (c, i) { return { c: c, used: false, color: COLORS[i % COLORS.length] }; });
    render();
  }

  // posisi slot (abaikan spasi & strip yang ditampilkan otomatis)
  function slotChars() { return cur.w.split(''); }

  function render() {
    var sl = $('slots'); sl.className = 'slots'; sl.innerHTML = '';
    var k = 0;
    slotChars().forEach(function (ch) {
      var d = document.createElement('div');
      if (ch === ' ') { d.className = 'slot space'; sl.appendChild(d); return; }
      if (ch === '-') { d.className = 'slot filled'; d.textContent = '-'; d.style.cursor = 'default'; sl.appendChild(d); return; }
      var p = picked[k];
      d.className = 'slot' + (p != null ? ' filled' : '');
      d.textContent = p != null ? tiles[p].c : '';
      if (p != null) { (function (idx) { d.addEventListener('pointerdown', function (e) { e.preventDefault(); unpickFrom(idx); }); })(k); }
      sl.appendChild(d); k++;
    });
    var pool = $('pool'); pool.innerHTML = '';
    tiles.forEach(function (t, i) {
      var b = document.createElement('button'); b.type = 'button';
      b.className = 'tile press' + (t.used ? ' used' : ''); b.textContent = t.c; b.style.setProperty('--c', t.color);
      b.setAttribute('aria-label', 'Huruf ' + t.c.toUpperCase());
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); pick(i); });
      pool.appendChild(b);
    });
  }

  function needed() { return cur.w.replace(/[ \-]/g, '').length; }
  function pick(i) {
    if (!running || tiles[i].used || picked.length >= needed()) return;
    tiles[i].used = true; picked.push(i); tone(500 + picked.length * 40, 0, .06, 'triangle', .08); render();
    if (picked.length === needed()) check();
  }
  function unpickFrom(k) { if (!running) return; picked.splice(k).forEach(function (i) { tiles[i].used = false; }); render(); }
  function undo() { if (picked.length) unpickFrom(picked.length - 1); }

  function toast(t) { var e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 1000); }

  function check() {
    var guess = picked.map(function (i) { return tiles[i].c; }).join('');
    var ans = cur.w.replace(/[ \-]/g, '');
    var ok = guess === ans;
    if (cur.idx != null) { var qs = qstats[cur.idx] || (qstats[cur.idx] = [0, 0]); qs[ok ? 0 : 1]++; }
    if (ok) {
      right++; var gain = Math.max(20, 50 + ans.length * 10 - hintUsed * 20); score += gain;
      $('score').textContent = score; $('slots').classList.add('good');
      history.push({ w: cur.w, ok: true }); var c = Fx.center($('slots')); Fx.good(c[0], c[1], '+' + gain);
      Sfx.good();
      running = false; setTimeout(function () { running = true; nextWord(); }, 800);
    } else {
      $('slots').classList.add('bad'); Sfx.bad(); var cb = Fx.center($('slots')); Fx.bad(null, cb[0], cb[1]);
      setTimeout(function () { $('slots').classList.remove('bad'); unpickFrom(0); }, 600);
    }
  }

  function hint() {
    if (!running) return;
    var ans = cur.w.replace(/[ \-]/g, '');
    // pastikan huruf yang sudah tersusun benar; buka huruf berikutnya
    var k = 0; while (k < picked.length && tiles[picked[k]].c === ans[k]) k++;
    unpickFrom(k);
    if (k >= ans.length) return;
    var i = tiles.findIndex(function (t) { return !t.used && t.c === ans[k]; });
    if (i >= 0) { hintUsed++; pick(i); }
  }

  function skip() {
    if (!running) return;
    skipped++; history.push({ w: cur.w, ok: false });
    if (cur.idx != null) { var qs = qstats[cur.idx] || (qstats[cur.idx] = [0, 0]); qs[1]++; }
    toast(cur.w.toUpperCase()); tone(300, 0, .15, 'square', .05);
    running = false; setTimeout(function () { running = true; nextWord(); }, 900);
  }

  function tick() {
    if (!timeLimit) return;
    timeLeft -= 0.25;
    var pct = Math.max(0, timeLeft / timeLimit * 100);
    $('bar').style.width = pct + '%'; $('bar').classList.toggle('low', pct < 25);
    if (timeLeft <= 0) end();
  }

  function start() {
    if (setQ) { var nm = ($('name').value || '').trim().replace(/\s+/g, ' ').slice(0, 30); if (!nm) { $('name').focus(); $('name').placeholder = 'Tulis namamu dulu ya'; return; } try { localStorage.setItem('bgy_name', nm); } catch (e) {} }
    queue = buildQueue(); score = 0; right = 0; skipped = 0; num = 0; history = []; qstats = {};
    $('score').textContent = '0';
    $('barBox').style.visibility = timeLimit ? 'visible' : 'hidden';
    timeLeft = timeLimit; $('bar').style.width = '100%';
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('game').classList.remove('hidden');
    $('bMute').textContent = muted ? '🔇' : '🔊';
    running = true; startAt = performance.now(); nextWord(); Sfx.go(); Sfx.music(true);
    clearInterval(timerId); timerId = setInterval(tick, 250);
  }

  function end() {
    if (window.Koin) Koin.add(score / 15, 'Susun Kata');
    running = false; clearInterval(timerId);
    $('oScore').textContent = score; $('oRight').textContent = right; $('oSkip').textContent = skipped;
    $('ovTitle').textContent = right >= 10 ? '🏆 Hebat sekali!' : right >= 5 ? '🎉 Bagus!' : 'Selesai!';
    var rv = $('review'); rv.innerHTML = '';
    history.forEach(function (h) { var d = document.createElement('div'); d.textContent = (h.ok ? '✅ ' : '⏭ ') + h.w.toUpperCase(); rv.appendChild(d); });
    $('over').classList.remove('hidden');
    Sfx.music(false); Sfx.win();
    submit();
  }

  function submit() {
    var saved = $('saved'); saved.textContent = '';
    if (!setCode || !history.length) return;
    saved.textContent = '⏳ Menyimpan skor ke kelas...';
    fetch('/api/set/' + setCode + '/hasil', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ name: $('name').value.trim().slice(0, 30), mode: 'edu', score: score, caught: right, quizRight: right, quizWrong: skipped, durationS: Math.round((performance.now() - startAt) / 1000), qStats: qstats })
    }).then(function (r) { if (!r.ok) throw new Error(r.status); })
      .then(function () { saved.innerHTML = '✅ Skormu tersimpan di kelas · <a href="/papan/' + setCode + '" target="_top">🏆 Lihat peringkat</a>'; })
      .catch(function () { saved.textContent = '⚠️ Skor belum tersimpan (periksa internet)'; });
  }

  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('toMenu').addEventListener('click', function () { Sfx.music(false); $('over').classList.add('hidden'); $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); });
  $('bUndo').addEventListener('click', undo);
  $('bShuffle').addEventListener('click', function () { if (!running) return; unpickFrom(0); shuffle(tiles); render(); });
  $('bHint').addEventListener('click', hint);
  $('bSkip').addEventListener('click', skip);
  $('bExit').addEventListener('click', function () { if (confirm('Selesai bermain?')) end(); });
  $('bMute').addEventListener('click', function () { muted = !muted; try { localStorage.setItem('bgy_muted', muted ? '1' : '0'); } catch (e) {} this.textContent = muted ? '🔇' : '🔊'; });
  // keyboard laptop: ketik huruf, Backspace hapus
  window.addEventListener('keydown', function (e) {
    if (!running || $('game').classList.contains('hidden')) return;
    if (e.key === 'Backspace') { e.preventDefault(); undo(); return; }
    var ch = (e.key || '').toLowerCase(); if (ch.length !== 1) return;
    var i = tiles.findIndex(function (t) { return !t.used && t.c === ch; }); if (i >= 0) pick(i);
  });
})();
</script>

<script src="/games/_shared/emoji.js"></script>
</body>
