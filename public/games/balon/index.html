<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Balon Pecah · Main-yuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b1a3a; --cream:#fff6dc; --yellow:#ffd23f; --orange:#ff7a1a; --pink:#ff5d8f; --mint:#2ec4b6; --blue:#4aa8ff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; color:var(--ink); background:var(--ink);
    font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif; touch-action:manipulation; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .hidden { display:none !important; }
  .nb { border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); }
  .nb-sm { border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .press:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .screen { position:absolute; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:10px; overflow:auto; z-index:20; }
  #menu { background:linear-gradient(#ffd9e6, #c9ecff); }
  .card { background:#fff; border-radius:22px; padding:16px 20px; width:min(100%, 760px); text-align:center; margin:auto; }
  .card h1 { font-size:clamp(26px, 5.5vh, 42px); line-height:1.05; font-weight:900; }
  .card h1 span { color:var(--pink); }
  .sub { font-size:13px; font-weight:700; opacity:.75; margin-top:4px; }
  .setinfo { margin-top:8px; font-size:12px; font-weight:800; background:#fff3c4; border:2px solid var(--ink); border-radius:10px; padding:3px 10px; display:inline-block; }
  .setinfo.ok { background:#c8f7dc; } .setinfo.err { background:#ffd6d6; }
  .row { margin-top:9px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .lbl { font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .seg button { padding:7px 13px; border-radius:12px; font-weight:900; font-size:15px; background:#fff; min-width:44px; }
  .seg button.on { background:var(--yellow); } .seg.multi button.on { background:var(--mint); }
  .off { opacity:.35; pointer-events:none; }
  .names { display:grid; gap:6px; grid-template-columns:repeat(2, 1fr); margin-top:10px; }
  .names label { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:900; }
  .names i { width:14px; height:14px; border-radius:50%; border:2px solid var(--ink); flex:none; background:var(--c); }
  .names input { flex:1; min-width:0; font:inherit; font-weight:800; border:2px solid var(--ink); border-radius:9px; padding:5px 8px; }
  .big { margin-top:12px; width:100%; padding:12px; border-radius:16px; background:var(--pink); font-size:20px; font-weight:900; }

  #game { position:absolute; inset:0; display:flex; flex-direction:column; }
  .topbar { flex:0 0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:3px 8px; color:#fff; font-weight:900; }
  .topbar .brand { font-size:12px; opacity:.8; }
  .topbar .tb { justify-self:end; display:flex; gap:6px; }
  .topbar .tb button { color:var(--ink); background:#fff; border-radius:99px; width:30px; height:30px; font-size:14px; }
  .timer { background:#fff; color:var(--ink); border-radius:99px; padding:1px 16px; font-weight:900; font-size:clamp(13px, 2.4vh, 20px); }
  .lanes { flex:1 1 auto; min-height:0; display:flex; gap:5px; }
  .lane { --c:#ff7675; position:relative; flex:1 1 0; min-width:0; display:flex; flex-direction:column; overflow:hidden;
    background:#cfeefb url(/games/_shared/kenney/backgroundColorGrass.png) center bottom / cover no-repeat; }
  .lane header { position:relative; z-index:3; background:var(--c); border-bottom:3px solid var(--ink); display:flex; align-items:center; justify-content:space-between; gap:6px; padding:4px 10px; font-weight:900; }
  .lane .name { font-size:clamp(13px, 2.4vh, 20px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lane .score { font-size:clamp(12px, 2.2vh, 18px); background:#fff; border:2px solid var(--ink); border-radius:99px; padding:0 9px; white-space:nowrap; }
  .qcard { position:relative; z-index:3; margin:7px 8px 0; background:#fff; border-radius:14px; padding:6px 10px; text-align:center; }
  .q { font-weight:900; line-height:1.2; font-size:clamp(15px, 3.4vh, 32px); max-height:4.8em; overflow:auto; }
  .q.long { font-size:clamp(13px, 2.4vh, 20px); }
  .sky { position:relative; flex:1 1 auto; }
  .sky::before { content:''; position:absolute; top:4%; left:-30%; width:60%; height:18%; background:url(/games/_shared/kenney/cloud3.png) left center / contain no-repeat; opacity:.95; animation:cloudGo 46s linear infinite; pointer-events:none; }
  @keyframes cloudGo { to { transform:translateX(260%); } }
  .balloon { position:absolute; z-index:2; bottom:0; transform:translate(-50%, 0); width:var(--bw); display:flex; flex-direction:column; align-items:center; cursor:pointer; touch-action:none; will-change:transform; }
  .balloon .body { width:100%; aspect-ratio:.86; border-radius:50% 50% 48% 48% / 55% 55% 45% 45%; background:var(--bc); border:3px solid var(--ink);
    box-shadow:inset -8px -10px 0 rgba(0,0,0,.12), inset 8px 8px 0 rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; padding:6px; text-align:center;
    font-weight:900; font-size:var(--bf); line-height:1.1; overflow:hidden; word-break:break-word; }
  .balloon .knot { width:12px; height:8px; background:var(--bc); border:3px solid var(--ink); border-top:0; border-radius:0 0 6px 6px; margin-top:-2px; }
  .balloon .str { width:2px; height:30px; background:var(--ink); opacity:.6; }
  .balloon.pop { animation:pop .3s ease-out forwards; pointer-events:none; }
  .balloon.wrong .body { background:#ff9aa8; } .balloon.wrong { animation:pop .45s .15s ease-out forwards; pointer-events:none; }
  @keyframes pop { 60% { transform:translate(-50%, var(--y)) scale(1.3); opacity:1; } 100% { transform:translate(-50%, var(--y)) scale(1.6); opacity:0; } }
  .burst { position:absolute; transform:translate(-50%,-50%); font-size:clamp(24px, 5vh, 44px); font-weight:900; pointer-events:none; animation:up .8s forwards; z-index:4; color:var(--ink); text-shadow:2px 2px 0 #fff; }
  @keyframes up { to { transform:translate(-50%,-140%); opacity:0; } }
  .ov { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:6px; text-align:center; font-weight:900; font-size:clamp(20px, 5vh, 36px); padding:10px; z-index:5; }
  .lane.frozen .ov.freeze { display:flex; background:rgba(255,154,168,.45); }
  .lane.win .ov.win { display:flex; background:rgba(255,210,63,.9); }
  #result { background:rgba(27,26,58,.78); }
  #result .card { width:min(100%, 560px); }
  .rank { margin-top:10px; display:grid; gap:6px; text-align:left; }
  .rk { display:flex; align-items:center; gap:10px; background:var(--cream); border-radius:12px; padding:6px 10px; font-weight:800; }
  .rk .pos { width:30px; height:30px; border-radius:50%; background:var(--c); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-weight:900; flex:none; }
  .rk .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rk small { font-size:11px; opacity:.7; display:block; font-weight:700; }
  .btns { margin-top:12px; display:flex; gap:8px; } .btns button { flex:1; padding:12px; border-radius:14px; font-weight:900; font-size:16px; }
  #saved { margin-top:8px; font-size:12px; font-weight:800; } #saved a { color:inherit; }
  @media (max-height:480px) {
    .card { padding:8px 12px; } .card h1 { font-size:22px; } .sub { display:none; } .row { margin-top:5px; } .seg button { padding:4px 10px; font-size:13px; } .big { margin-top:7px; padding:7px; font-size:17px; }
    .qcard { margin:3px 5px 0; padding:3px 6px; } .lane header { padding:2px 8px; } .topbar .tb button { width:24px; height:24px; }
  }
  @media (prefers-reduced-motion: reduce) { .balloon.pop, .balloon.wrong, .burst { animation-duration:.01s; } }
  .mg-wrap { margin-top:10px; }
  .mg-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; margin-top:6px; }
  .mg-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px 2px; border-radius:12px; background:#fff; border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); min-height:54px; }
  .mg-btn .mg-i { font-size:clamp(16px, 3.2vh, 24px); font-weight:900; line-height:1; }
  .mg-btn .mg-l { font-size:10px; font-weight:800; line-height:1.1; text-align:center; }
  .mg-btn.on { background:var(--yellow); transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }
  .mg-btn:active { transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  @media (max-width:520px) { .mg-grid { grid-template-columns:repeat(4, 1fr); } }
  @media (max-height:480px) { .mg-btn { min-height:38px; padding:3px 2px; } .mg-btn .mg-l { font-size:9px; } .mg-grid { gap:4px; } }
</style>

</head>
<body>
<div id="menu" class="screen">
  <div class="card nb">
    <h1>Balon <span>Pecah</span> 🎈</h1>
    <div class="sub">Balon jawaban terbang ke atas. Pecahkan balon yang benar sebelum lepas! Siapa paling dulu memecahkan target, dia menang.</div>
    <div class="setinfo" id="setinfo">🧮 Soal matematika otomatis</div>
    <div class="row"><span class="lbl">Pemain</span>
      <div class="seg" id="segPlayers"><button class="nb-sm press" data-n="1">1</button><button class="nb-sm press" data-n="2">2</button><button class="nb-sm press" data-n="3">3</button><button class="nb-sm press" data-n="4">4</button></div></div>
    <div class="mg-wrap mathonly"><div class="lbl">Jenis soal</div><div class="mg-grid" id="mg"></div></div>
    <div class="row mathonly"><span class="lbl">Tingkat</span>
      <div class="seg" id="segLevel"><button class="nb-sm press" data-n="1">Mudah</button><button class="nb-sm press" data-n="2">Sedang</button><button class="nb-sm press" data-n="3">Sulit</button></div></div>
    <div class="row"><span class="lbl">Tempo</span>
      <div class="seg" id="segTempo"><button class="nb-sm press" data-n="0.6">🐢 Lambat</button><button class="nb-sm press" data-n="1">🚶 Sedang</button><button class="nb-sm press" data-n="1.5">🚀 Cepat</button></div></div>
    <div class="row"><span class="lbl">Target</span>
      <div class="seg" id="segTarget"><button class="nb-sm press" data-n="8">8 balon</button><button class="nb-sm press" data-n="12">12 balon</button><button class="nb-sm press" data-n="18">18 balon</button></div></div>
    <div class="names" id="names"></div>
    <button id="start" class="big nb press">🎈 MULAI</button>
  </div>
</div>

<div id="game" class="hidden"></div>
<div id="result" class="screen hidden"></div>

<script src="/games/_shared/mathgen.js"></script>
<script src="/games/_shared/sfx.js"></script>
<script src="/games/_shared/dialog.js"></script>
<script src="/games/_shared/suara.js"></script>
<script src="/games/_shared/tutor.js"></script>
<script src="/games/_shared/koin.js"></script>
<script src="/games/_shared/fx.js"></script>
<script src="/games/_shared/ruang.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = ['#ff7675', '#4aa8ff', '#55efc4', '#feca57'];
  var BCOL = ['#ff5d8f', '#ffd23f', '#4aa8ff', '#2ec4b6', '#b79cff'];
  var roomMode = !!(window.Ruang && Ruang.active), roomName = '', setFail = false;
  var setQ = null, setCode = null, nPlayers = 1, target = 12, level = 1, mathMode = 'add';
  var lanes = [], running = false, finished = false, startAt = 0, timerId = 0, raf = 0, lastT = 0;
  var muted = false; try { muted = localStorage.getItem('bgy_muted') === '1'; } catch (e) {}
  var actx = null;
  function tone(f, t, d, type, v) { if (muted) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); var o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + t; o.type = type || 'sine'; o.frequency.setValueAtTime(f, s); g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(v || .14, s + .015); g.gain.exponentialRampToValueAtTime(.0001, s + d); o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + d + .02); } catch (e) {} }
  function sPop() { Sfx.pop(); Sfx.good(); }
  function sBad() { Sfx.bad(); }
  function sWin() { Sfx.music(false); Sfx.win(); }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function makeMath() { return MathGen.make(mathMode, level); }


  (function loadSet() {
    var code = (new URLSearchParams(location.search).get('set') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) return;
    var info = $('setinfo'); info.textContent = '⏳ Memuat soal dari guru...';
    fetch('/api/set/' + code).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); }).then(function (d) {
      var qs = (Array.isArray(d.questions) ? d.questions : []).map(function (q, i) { return q && { q: q.q, o: q.o, a: q.a, idx: i }; }).filter(function (q) {
        return q && typeof q.q === 'string' && Array.isArray(q.o) && (q.o.length === 4 || q.o.length === 5) && q.a >= 0 && q.a < q.o.length;
      });
      if (!qs.length) throw new Error('kosong');
      setQ = qs; setCode = code;
      info.textContent = '📚 Soal guru: ' + d.title + ' (' + qs.length + ' soal)'; info.className = 'setinfo ok';
      [].forEach.call(document.querySelectorAll('.mathonly'), function (el) { el.classList.add('off'); });
    }).catch(function () { setFail = true; info.textContent = '⚠️ Kode soal tidak ditemukan. Memakai soal matematika otomatis.'; info.className = 'setinfo err'; });
  })();

  function renderNames() {
    var box = $('names'); box.innerHTML = '';
    for (var i = 0; i < nPlayers; i++) {
      var l = document.createElement('label'); l.style.setProperty('--c', COLORS[i]);
      l.innerHTML = '<i></i><input maxlength="14" placeholder="Pemain ' + (i + 1) + '" autocomplete="off">';
      box.appendChild(l);
    }
  }
  function seg(id, fn, isOn) {
    var el = $(id);
    function mark() { [].forEach.call(el.children, function (b) { b.classList.toggle('on', isOn(b.dataset.n)); }); }
    el.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; fn(b.dataset.n); mark(); tone(600, 0, .06); });
    mark();
  }
  seg('segPlayers', function (n) { nPlayers = +n; renderNames(); }, function (n) { return +n === nPlayers; });
  seg('segTarget', function (n) { target = +n; }, function (n) { return +n === target; });
  var tempo = 1; try { tempo = +localStorage.getItem('tempo_balon') || 1; } catch (e) {}
  seg('segTempo', function (n) { tempo = +n; try { localStorage.setItem('tempo_balon', n); } catch (e) {} }, function (n) { return +n === tempo; });
  seg('segLevel', function (n) { level = +n; }, function (n) { return +n === level; });
  MathGen.renderGrid($('mg'), mathMode, function (id) { mathMode = id; tone(600, 0, .06, 'sine', .08); });
  renderNames();

  function nextQ(L) {
    if (!setQ) return makeMath();
    if (!L.bag.length) L.bag = shuffle(setQ.slice());
    return L.bag.pop();
  }

  function buildLane(i, name) {
    var el = document.createElement('section'); el.className = 'lane'; el.style.setProperty('--c', COLORS[i]);
    el.innerHTML = '<header><span class="name"></span><span class="score">🎈 0' + (roomMode ? '' : '/' + target) + '</span></header>' +
      '<div class="qcard nb-sm"><div class="q"></div></div><div class="sky"></div>' +
      '<div class="ov freeze">💥 Salah!<small style="font-size:.5em">tunggu sebentar…</small></div>' +
      '<div class="ov win">🏆<div><span class="wn"></span> menang!</div></div>';
    el.querySelector('.name').textContent = name;
    return { i: i, name: name, el: el, sky: el.querySelector('.sky'), bag: [], cur: null, balloons: [], popped: 0, wrong: 0, miss: 0, score: 0, locked: false, shownAt: 0, lastAt: 0, qstats: {} };
  }

  function showQuestion(L) {
    L.balloons.forEach(function (b) { b.el.remove(); }); L.balloons = [];
    var item = nextQ(L); L.cur = item; L.locked = false; L.shownAt = performance.now();
    if (lanes.length === 1 && window.Suara) Suara.read(item.q);
    var qEl = L.el.querySelector('.q'); qEl.textContent = item.q; qEl.classList.toggle('long', item.q.length > 50);
    var n = item.o.length, W = L.sky.clientWidth, H = L.sky.clientHeight;
    var bw = Math.max(56, Math.min(150, W / n - 10, H * 0.32));
    var longest = item.o.reduce(function (m, t) { return Math.max(m, String(t).length); }, 1);
    var bf = Math.max(11, Math.min(bw * 0.34, bw * 1.5 / Math.max(3, longest)));
    var order = shuffle(item.o.map(function (_, k) { return k; }));
    order.forEach(function (k, pos) {
      var b = document.createElement('div'); b.className = 'balloon';
      b.style.setProperty('--bw', bw + 'px'); b.style.setProperty('--bf', bf + 'px'); b.style.setProperty('--bc', BCOL[k % BCOL.length]);
      b.style.left = ((pos + .5) / n * 100) + '%';
      b.innerHTML = '<div class="body"></div><div class="knot"></div><div class="str"></div>';
      b.querySelector('.body').textContent = item.o[k];
      b.setAttribute('role', 'button'); b.setAttribute('aria-label', 'Jawaban ' + item.o[k]);
      var obj = { el: b, k: k, y: rnd(0, Math.round(H * 0.12)), v: 0, phase: Math.random() * 6.28, base: (pos + .5) / n * 100 };
      b.addEventListener('pointerdown', function (e) { e.preventDefault(); answer(L, obj); });
      L.sky.appendChild(b); L.balloons.push(obj);
    });
  }

  function speedFor() { var el = (performance.now() - startAt) / 1000; return ((setQ ? 34 : [0, 38, 34, 30][level]) + el * 0.25) * tempo; }

  function burst(L, obj, text) {
    var r = obj.el.getBoundingClientRect(), s = L.sky.getBoundingClientRect();
    var d = document.createElement('div'); d.className = 'burst'; d.textContent = text;
    d.style.left = (r.left - s.left + r.width / 2) + 'px'; d.style.top = (r.top - s.top + r.width / 2) + 'px';
    L.sky.appendChild(d); setTimeout(function () { d.remove(); }, 800);
  }

  function answer(L, obj) {
    if (window.Tutor) Tutor.done();
    if (!running || L.locked || finished) return;
    var ok = obj.k === L.cur.a, t = performance.now() - L.shownAt;
    if (L.cur.idx != null) { var qs = L.qstats[L.cur.idx] || (L.qstats[L.cur.idx] = [0, 0]); qs[ok ? 0 : 1]++; }
    obj.el.style.setProperty('--y', (-obj.y) + 'px');
    if (ok) {
      var c = Fx.center(obj.el.querySelector('.body'));
      L.locked = true; sPop(); obj.el.classList.add('pop');
      L.popped++; L.lastAt = performance.now(); var gain = 100 + Math.max(0, Math.round((7000 - t) / 100)); L.score += gain;
      Fx.good(c[0], c[1], '+' + gain);
      L.el.querySelector('.score').textContent = '🎈 ' + L.popped + (roomMode ? '' : '/' + target);
      L.balloons.forEach(function (b) { if (b !== obj) { b.el.style.setProperty('--y', (-b.y) + 'px'); b.el.style.opacity = '.35'; } });
      if (L.popped >= target) { finish(L); return; }
      setTimeout(function () { if (!finished) showQuestion(L); }, 500);
    } else {
      var cb = Fx.center(obj.el.querySelector('.body'));
      L.locked = true; sBad(); obj.el.classList.add('wrong'); L.wrong++; Fx.bad(L.el, cb[0], cb[1]);
      L.balloons.forEach(function (b) { if (b.k === L.cur.a) b.el.querySelector('.body').style.outline = '4px solid #2ec4b6'; });
      L.el.classList.add('frozen');
      setTimeout(function () { L.el.classList.remove('frozen'); if (!finished) showQuestion(L); }, 1400);
    }
  }

  function loop(t) {
    if (!running) return;
    var dt = Math.min(50, t - (lastT || t)) / 1000; lastT = t;
    var v = speedFor();
    lanes.forEach(function (L) {
      if (L.locked) return;
      var H = L.sky.clientHeight, escaped = false, vv = v * Math.max(1, H / 420);
      L.balloons.forEach(function (b) {
        b.y += vv * dt; b.phase += dt * 1.6;
        var sway = Math.sin(b.phase) * 6;
        b.el.style.transform = 'translate(calc(-50% + ' + sway + 'px), ' + (-b.y) + 'px)';
        if (b.y > H - b.el.offsetHeight * 0.35) escaped = true;
      });
      if (escaped) {
        L.miss++; if (L.cur.idx != null) { var qs = L.qstats[L.cur.idx] || (L.qstats[L.cur.idx] = [0, 0]); qs[1]++; }
        Sfx.bad(); showQuestion(L);
      }
    });
    raf = requestAnimationFrame(loop);
  }

  function tickTimer() { var s = Math.floor((performance.now() - startAt) / 1000); $('timer').textContent = '⏱ ' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

  function start() {
    if (window.Tutor) setTimeout(Tutor.hint, 3600);
    var names = roomMode ? [roomName || 'Kamu'] : [].map.call($('names').querySelectorAll('input'), function (inp, i) { return (inp.value || '').trim().replace(/[<>]/g, '') || ('Pemain ' + (i + 1)); });
    finished = false; running = false; cancelAnimationFrame(raf); clearInterval(timerId);
    var g = $('game'); g.innerHTML = ''; g.classList.remove('hidden');
    $('menu').classList.add('hidden'); $('result').classList.add('hidden');
    var bar = document.createElement('div'); bar.className = 'topbar';
    bar.innerHTML = '<span class="brand">Main-yuk · Balon Pecah</span><span id="timer" class="timer nb-sm">⏱ 00:00</span>' +
      '<span class="tb"><button class="nb-sm press" id="bMute" aria-label="Suara">' + (muted ? '🔇' : '🔊') + '</button><button class="nb-sm press" id="bExit" aria-label="Keluar">✖</button></span>';
    g.appendChild(bar);
    var wrap = document.createElement('div'); wrap.className = 'lanes'; g.appendChild(wrap);
    lanes = names.map(function (n, i) { return buildLane(i, n); });
    lanes.forEach(function (L) { wrap.appendChild(L.el); });
    $('bMute').onclick = function () { muted = !muted; try { localStorage.setItem('bgy_muted', muted ? '1' : '0'); } catch (e) {} this.textContent = muted ? '🔇' : '🔊'; };
    $('bExit').onclick = function () { Dialog.ask('Selesai bermain sekarang?', function () { toMenu(); }); };
    var n = roomMode ? 0 : 3, ov = document.createElement('div');
    ov.style.cssText = 'position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(27,26,58,.6);color:#fff;font-weight:900;font-size:22vh';
    g.appendChild(ov);
    (function cd() {
      if (n > 0) { ov.textContent = n; Sfx.tick(); n--; setTimeout(cd, 800); }
      else { ov.textContent = '🎈'; Sfx.go(); Sfx.music(true); setTimeout(function () { ov.remove(); }, 400);
        running = true; startAt = performance.now(); lastT = 0; lanes.forEach(showQuestion); raf = requestAnimationFrame(loop); timerId = setInterval(tickTimer, 250); tickTimer(); }
    })();
  }

  function finish(w) {
    finished = true; running = false; cancelAnimationFrame(raf); clearInterval(timerId); sWin(); Fx.win();
    var dur = Math.round((performance.now() - startAt) / 1000);
    w.el.classList.add('win'); w.el.querySelector('.wn').textContent = w.name;
    setTimeout(function () { showResult(w, dur); }, 1400);
  }

  function showResult(w, dur) {
    if (window.Koin) Koin.add(Math.max.apply(null, lanes.map(function (L) { return L.score || 0; })) / 25, 'Balon');
    var order = lanes.slice().sort(function (a, b) { if (a === w) return -1; if (b === w) return 1; return b.popped - a.popped || a.lastAt - b.lastAt; });
    var res = $('result'); res.classList.remove('hidden');
    res.innerHTML = '<div class="card nb"><h1></h1><div class="sub">Waktu ' + dur + ' detik · target ' + target + ' balon</div><div class="rank"></div><div id="saved"></div>' +
      '<div class="btns"><button id="again" class="nb press" style="background:var(--pink)">🔄 Main Lagi</button><button id="toMenu" class="nb press" style="background:var(--yellow)">🏠 Menu</button></div></div>';
    res.querySelector('h1').textContent = lanes.length > 1 ? '🏆 ' + w.name + ' menang!' : '🎉 Target tercapai!';
    var box = res.querySelector('.rank'), med = ['🥇', '🥈', '🥉', '4'];
    order.forEach(function (L, r) {
      var d = document.createElement('div'); d.className = 'rk'; d.style.setProperty('--c', COLORS[L.i]);
      var pos = document.createElement('span'); pos.className = 'pos'; pos.textContent = med[r];
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = L.name;
      var sm = document.createElement('small'); sm.textContent = '🎈 ' + L.popped + ' benar · ' + L.wrong + ' salah · ' + L.miss + ' lepas'; nm.appendChild(sm);
      var sc = document.createElement('b'); sc.textContent = L.score;
      d.appendChild(pos); d.appendChild(nm); d.appendChild(sc); box.appendChild(d);
    });
    $('again').onclick = start; $('toMenu').onclick = toMenu;
    if (setCode) {
      var saved = $('saved'); saved.textContent = '⏳ Menyimpan hasil ke kelas...';
      Promise.all(lanes.map(function (L) {
        return fetch('/api/set/' + setCode + '/hasil', { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
          body: JSON.stringify({ name: L.name, mode: 'race', score: L.score, caught: L.popped, quizRight: L.popped, quizWrong: L.wrong + L.miss, durationS: dur, qStats: L.qstats })
        }).then(function (r) { if (!r.ok) throw new Error(r.status); });
      })).then(function () { saved.innerHTML = '✅ Hasil tersimpan di kelas · <a href="/papan/' + setCode + '" target="_top">🏆 Lihat peringkat</a>'; })
        .catch(function () { saved.textContent = '⚠️ Hasil belum tersimpan (periksa internet)'; });
    }
  }

  function toMenu() { Sfx.music(false); running = false; finished = true; cancelAnimationFrame(raf); clearInterval(timerId); $('game').classList.add('hidden'); $('result').classList.add('hidden'); $('menu').classList.remove('hidden'); }
  $('start').addEventListener('click', start);

  // ---------- Mabar Online (ruang 5 angka) ----------
  if (roomMode) {
    $('menu').classList.add('hidden');
    Ruang.init({
      ready: function () { return !!setQ || setFail; },
      onStart: function (ms, name) { roomName = name; nPlayers = 1; target = 99999; start(); $('bExit').style.display = 'none'; },
      getStats: function () { var L = lanes[0] || {}; return { score: L.score || 0, caught: L.popped || 0, quizRight: L.popped || 0, quizWrong: (L.wrong || 0) + (L.miss || 0) }; },
      onEnd: function () { running = false; finished = true; cancelAnimationFrame(raf); clearInterval(timerId); }
    });
  }
  if (window.Tutor) Tutor.init('balon', [{"sel": "#segPlayers", "text": "Pilih jumlah pemain. Untuk layar kelas, 2 sampai 4 anak bisa main bersamaan."}, {"sel": "#mg", "text": "Pilih jenis soal yang mau dilatih."}, {"sel": "#segTarget", "text": "Tentukan target berapa balon yang harus dipecahkan."}, {"sel": "#start", "text": "Tekan MULAI! Pecahkan balon berisi jawaban yang benar."}], { inGame: "Ketuk balon yang berisi jawaban benar sebelum terbang!" });
})();
</script>
<script src="/games/_shared/twemoji.min.js"></script>
<script src="/games/_shared/emoji.js"></script>
</body>
