<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tebak Emoji · Main-yuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1b1a3a; --cream:#fff6dc; --yellow:#ffd23f; --orange:#ff7a1a; --pink:#ff5d8f; --mint:#2ec4b6; --blue:#4aa8ff; --lilac:#b79cff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; color:var(--ink);
    font-family: ui-rounded, "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif; touch-action:manipulation;
    background:var(--lilac) radial-gradient(rgba(27,26,58,.12) 1.5px, transparent 1.5px) 0 0 / 18px 18px; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  .hidden { display:none !important; }
  .nb { border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); }
  .nb-sm { border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink); }
  .press:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; overflow:auto; gap:clamp(8px, 2vh, 16px); }
  .card { background:#fff; border-radius:22px; padding:16px 20px; width:min(100%, 600px); text-align:center; }
  .card h1 { font-size:clamp(26px, 5.5vh, 42px); line-height:1.05; font-weight:900; }
  .card h1 span { color:var(--orange); }
  .sub { font-size:13px; font-weight:700; opacity:.75; margin-top:4px; }
  .row { margin-top:10px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .lbl { font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.6px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .seg button { padding:7px 13px; border-radius:12px; font-weight:900; font-size:15px; background:#fff; }
  .seg button.on { background:var(--yellow); }
  .big { margin-top:12px; width:100%; padding:12px; border-radius:16px; background:var(--orange); font-size:20px; font-weight:900; }

  .hud { width:min(100%, 900px); display:flex; align-items:center; gap:8px; font-weight:900; }
  .pill { background:#fff; border-radius:99px; padding:3px 12px; font-size:clamp(13px, 2.4vh, 18px); white-space:nowrap; }
  .pill.turn { background:var(--c); }
  .bar { flex:1; height:14px; background:#fff; border:2px solid var(--ink); border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--mint); }
  .bar i.low { background:var(--pink); }
  .hud button { background:#fff; border-radius:99px; width:34px; height:34px; }
  .puzzle { width:min(100%, 900px); background:#fff; border-radius:24px; padding:clamp(10px, 2.5vh, 22px); text-align:center; }
  .puzzle small { font-size:12px; font-weight:900; text-transform:uppercase; letter-spacing:.7px; opacity:.6; }
  .emo { font-size:clamp(48px, 15vh, 130px); line-height:1.15; letter-spacing:.06em; font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  .opts { width:min(100%, 900px); display:grid; grid-template-columns:1fr 1fr; gap:clamp(6px, 1.5vh, 12px); }
  .opt { background:#fff; border-radius:16px; padding:clamp(10px, 2.4vh, 20px) 10px; font-weight:900; font-size:clamp(16px, 3.4vh, 30px); line-height:1.15; }
  .opt.good { background:#8cf0b8; } .opt.bad { background:#ff9aa8; }
  .opt:disabled { cursor:default; }
  .toast { position:fixed; left:50%; top:45%; transform:translate(-50%,-50%); font-size:clamp(30px, 9vh, 72px); font-weight:900; pointer-events:none; animation:fade 1.1s forwards; z-index:9; text-shadow:3px 3px 0 #fff; }
  @keyframes fade { 0% { opacity:0; transform:translate(-50%,-30%) scale(.6); } 25% { opacity:1; transform:translate(-50%,-50%) scale(1.1); } 100% { opacity:0; transform:translate(-50%,-80%); } }
  .teams { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .teams div { background:var(--c); border-radius:14px; padding:8px; font-weight:900; font-size:clamp(18px, 4vh, 30px); }
  .teams small { display:block; font-size:12px; }
  .btns { margin-top:12px; display:flex; gap:8px; } .btns button { flex:1; padding:12px; border-radius:14px; font-weight:900; font-size:16px; }
  .review { margin-top:10px; max-height:32vh; overflow:auto; text-align:left; font-size:14px; font-weight:700; }
  .review div { padding:4px 6px; border-bottom:1px dashed rgba(27,26,58,.2); }
  @media (max-width:520px) { .opts { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation:none; opacity:0; } }
</style>
<link rel="stylesheet" href="/games/_shared/theme.css">
</head>
<body>
<div id="menu" class="screen">
  <div class="card nb">
    <h1>Tebak <span>Emoji</span> 🤔</h1>
    <div class="sub">Lihat gabungan emoji, lalu tebak kata yang dimaksud. Cocok ditampilkan di IFP untuk satu kelas!</div>
    <div class="row"><span class="lbl">Main</span>
      <div class="seg" id="segMode"><button class="nb-sm press" data-n="solo">🙋 Sendiri</button><button class="nb-sm press" data-n="tim">👥 2 Tim bergantian</button></div></div>
    <div class="row"><span class="lbl">Ronde</span>
      <div class="seg" id="segRounds"><button class="nb-sm press" data-n="10">10</button><button class="nb-sm press" data-n="16">16</button><button class="nb-sm press" data-n="24">24</button></div></div>
    <div class="row"><span class="lbl">Waktu</span>
      <div class="seg" id="segTime"><button class="nb-sm press" data-n="15">15 dtk</button><button class="nb-sm press" data-n="25">25 dtk</button><button class="nb-sm press" data-n="0">Santai</button></div></div>
    <button id="start" class="big nb press">▶ MULAI</button>
  </div>
</div>

<div id="game" class="screen hidden">
  <div class="hud">
    <span class="pill nb-sm" id="round">1/10</span>
    <span class="pill nb-sm turn hidden" id="turn"></span>
    <span class="pill nb-sm" id="score">0</span>
    <div class="bar" id="barBox"><i id="bar"></i></div>
    <button class="nb-sm press" id="bMute" aria-label="Suara">🔊</button>
    <button class="nb-sm press" id="bExit" aria-label="Selesai">✖</button>
  </div>
  <div class="puzzle nb"><small id="cat"></small><div class="emo" id="emo" role="img"></div></div>
  <div class="opts" id="opts"></div>
</div>

<div id="over" class="screen hidden" style="background:rgba(27,26,58,.72)">
  <div class="card nb">
    <h1 id="ovTitle">Selesai!</h1>
    <div id="ovScore" class="sub" style="font-size:18px;opacity:1"></div>
    <div class="teams hidden" id="teams"></div>
    <div class="review" id="review"></div>
    <div class="btns"><button id="again" class="nb press" style="background:var(--orange)">🔄 Main Lagi</button><button id="toMenu" class="nb press" style="background:var(--yellow)">🏠 Menu</button></div>
  </div>
</div>

<script src="/games/_shared/sfx.js"></script>
<script src="/games/_shared/suara.js"></script>
<script src="/games/_shared/tutor.js"></script>
<script src="/games/_shared/koin.js"></script>
<script src="/games/_shared/fx.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  // [emoji, jawaban, kategori]
  var BANK = [
    ['🏠🤒', 'Rumah sakit', 'Tempat'], ['🎒🏫', 'Sekolah', 'Tempat'], ['📚🤫', 'Perpustakaan', 'Tempat'], ['🛒🥬🐟', 'Pasar', 'Tempat'], ['🏖️🌊', 'Pantai', 'Tempat'], ['🛫🧳', 'Bandara', 'Tempat'],
    ['🚒🔥', 'Pemadam kebakaran', 'Profesi'], ['👩‍⚕️💉', 'Dokter', 'Profesi'], ['👨‍🌾🌾', 'Petani', 'Profesi'], ['🎣🐟🚤', 'Nelayan', 'Profesi'], ['👮🚦', 'Polisi lalu lintas', 'Profesi'], ['👨‍🍳🍳', 'Koki', 'Profesi'], ['👩‍🏫📖', 'Guru', 'Profesi'],
    ['🌧️☀️🌈', 'Pelangi', 'Alam'], ['⛰️🔥💨', 'Gunung berapi', 'Alam'], ['🌙⭐', 'Malam', 'Alam'], ['🌊🌊🏄', 'Ombak', 'Alam'], ['⚡🌧️', 'Badai petir', 'Alam'],
    ['🐛➡️🦋', 'Metamorfosis', 'IPA'], ['🌱☀️💧', 'Fotosintesis', 'IPA'], ['🧊➡️💧', 'Mencair', 'IPA'], ['💧➡️☁️', 'Menguap', 'IPA'], ['🧲📎', 'Magnet', 'IPA'], ['⚡💡', 'Listrik', 'IPA'], ['🥚➡️🐣', 'Menetas', 'IPA'], ['🌍🔄☀️', 'Revolusi bumi', 'IPA'],
    ['🇮🇩📜🎤', 'Proklamasi', 'Indonesia'], ['🦅⭐🌾', 'Garuda Pancasila', 'Indonesia'], ['🇮🇩🎋🏃', 'Lomba 17 Agustus', 'Indonesia'], ['🎭🇮🇩', 'Wayang', 'Indonesia'], ['🦎🏝️', 'Komodo', 'Indonesia'],
    ['🍚🍳', 'Nasi goreng', 'Makanan'], ['🍢🔥🥜', 'Sate', 'Makanan'], ['🍜🐔', 'Mi ayam', 'Makanan'], ['🥬🥜🥚', 'Gado-gado', 'Makanan'], ['🧊🍧🍓', 'Es campur', 'Makanan'],
    ['🦷🪥', 'Sikat gigi', 'Kebiasaan'], ['🧼👐💧', 'Cuci tangan', 'Kebiasaan'], ['🗑️♻️', 'Daur ulang', 'Kebiasaan'], ['🌳🌱🙌', 'Menanam pohon', 'Kebiasaan'],
    ['🚂🛤️', 'Kereta api', 'Benda'], ['🌧️☂️', 'Payung', 'Benda'], ['🎆🔥', 'Kembang api', 'Benda'], ['⏰⌚', 'Jam tangan', 'Benda'], ['🚲🔔', 'Sepeda', 'Benda'], ['✏️📏', 'Alat tulis', 'Benda'],
    ['🐢🐇🏁', 'Kura-kura dan kelinci', 'Dongeng'], ['🦌🐊🌊', 'Kancil dan buaya', 'Dongeng'], ['👦🪨😢', 'Malin Kundang', 'Dongeng'],
    ['🎂🕯️🎉', 'Ulang tahun', 'Acara'], ['🎓🎉', 'Wisuda', 'Acara']
  ];
  var TEAM = [{ n: 'Tim Merah', c: '#ff7675' }, { n: 'Tim Biru', c: '#4aa8ff' }];
  var mode = 'solo', rounds = 10, timeLimit = 25;
  var deck = [], idx = 0, score = 0, teamScore = [0, 0], turn = 0, locked = false, timeLeft = 0, timerId = 0, history = [];
  var muted = false; try { muted = localStorage.getItem('bgy_muted') === '1'; } catch (e) {}
  var actx = null;
  function tone(f, t, d, type, v) { if (muted) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); var o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + t; o.type = type || 'sine'; o.frequency.setValueAtTime(f, s); g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(v || .12, s + .015); g.gain.exponentialRampToValueAtTime(.0001, s + d); o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + d + .02); } catch (e) {} }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function seg(id, fn, isOn) {
    var el = $(id);
    function mark() { [].forEach.call(el.children, function (b) { b.classList.toggle('on', isOn(b.dataset.n)); }); }
    el.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; fn(b.dataset.n); mark(); tone(600, 0, .06); });
    mark();
  }
  seg('segMode', function (n) { mode = n; }, function (n) { return n === mode; });
  seg('segRounds', function (n) { rounds = +n; }, function (n) { return +n === rounds; });
  seg('segTime', function (n) { timeLimit = +n; }, function (n) { return +n === timeLimit; });

  function toast(t) { var e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 1100); }

  function show() {
    var p = deck[idx]; locked = false;
    if (window.Suara) Suara.read('Tebak kata dari emoji. Kategori ' + p[2]);
    $('round').textContent = (idx + 1) + '/' + deck.length;
    $('emo').textContent = p[0]; $('emo').setAttribute('aria-label', 'Teka-teki emoji'); $('cat').textContent = 'Kategori: ' + p[2];
    if (mode === 'tim') { var T = TEAM[turn]; $('turn').textContent = 'Giliran ' + T.n; $('turn').style.setProperty('--c', T.c); $('score').textContent = teamScore[0] + ' : ' + teamScore[1]; }
    // pilihan: 3 pengecoh, utamakan kategori yang sama
    var same = BANK.filter(function (b) { return b[1] !== p[1] && b[2] === p[2]; }), other = BANK.filter(function (b) { return b[1] !== p[1] && b[2] !== p[2]; });
    var wrong = shuffle(same).slice(0, 2).concat(shuffle(other)).slice(0, 3).map(function (b) { return b[1]; });
    var opts = shuffle([p[1]].concat(wrong));
    var box = $('opts'); box.innerHTML = '';
    opts.forEach(function (o) {
      var b = document.createElement('button'); b.className = 'opt nb press'; b.type = 'button'; b.textContent = o;
      b.addEventListener('click', function () { answer(o, b); });
      box.appendChild(b);
    });
    timeLeft = timeLimit; renderBar();
  }

  function renderBar() { if (!timeLimit) return; var pct = Math.max(0, timeLeft / timeLimit * 100); $('bar').style.width = pct + '%'; $('bar').classList.toggle('low', pct < 30); }

  function answer(o, btn) {
    if (window.Tutor) Tutor.done();
    if (locked) return; locked = true;
    var p = deck[idx], ok = o === p[1];
    [].forEach.call($('opts').children, function (b) { b.disabled = true; if (b.textContent === p[1]) b.classList.add('good'); });
    if (ok) {
      var gain = 100 + (timeLimit ? Math.round(timeLeft / timeLimit * 50) : 0);
      if (mode === 'tim') teamScore[turn] += gain; else score += gain;
      var c = btn ? Fx.center(btn) : null; Fx.good(c && c[0], c && c[1], '+' + gain); Sfx.good();
    } else {
      if (btn) btn.classList.add('bad');
      var cb = btn ? Fx.center(btn) : null; Fx.bad($('opts'), cb && cb[0], cb && cb[1]); Sfx.bad();
    }
    history.push({ e: p[0], a: p[1], ok: ok, t: mode === 'tim' ? TEAM[turn].n : '' });
    if (mode === 'tim') $('score').textContent = teamScore[0] + ' : ' + teamScore[1]; else $('score').textContent = score;
    setTimeout(function () {
      idx++; if (mode === 'tim') turn = 1 - turn;
      if (idx >= deck.length) end(); else show();
    }, 1400);
  }

  function tick() {
    if (!timeLimit || locked || $('game').classList.contains('hidden')) return;
    timeLeft -= 0.25; renderBar();
    if (timeLeft <= 0) answer(null, null);
  }

  function start() {
    if (window.Tutor) setTimeout(Tutor.hint, 400);
    deck = shuffle(BANK.slice()).slice(0, rounds); idx = 0; score = 0; teamScore = [0, 0]; turn = 0; history = [];
    $('turn').classList.toggle('hidden', mode !== 'tim');
    $('barBox').style.visibility = timeLimit ? 'visible' : 'hidden';
    $('score').textContent = mode === 'tim' ? '0 : 0' : '0';
    $('bMute').textContent = muted ? '🔇' : '🔊';
    $('menu').classList.add('hidden'); $('over').classList.add('hidden'); $('game').classList.remove('hidden');
    show(); clearInterval(timerId); timerId = setInterval(tick, 250); Sfx.go(); Sfx.music(true);
  }

  function end() {
    if (window.Koin) Koin.add((score + teamScore[0] + teamScore[1]) / 20, 'Tebak Emoji');
    clearInterval(timerId); $('game').classList.add('hidden');
    var right = history.filter(function (h) { return h.ok; }).length;
    var tm = $('teams');
    if (mode === 'tim') {
      var w = teamScore[0] === teamScore[1] ? -1 : teamScore[0] > teamScore[1] ? 0 : 1;
      $('ovTitle').textContent = w < 0 ? '🤝 Seri!' : '🏆 ' + TEAM[w].n + ' menang!';
      $('ovScore').textContent = right + ' dari ' + history.length + ' tebakan benar';
      tm.innerHTML = ''; TEAM.forEach(function (T, i) { var d = document.createElement('div'); d.style.setProperty('--c', T.c); d.className = 'nb-sm'; d.innerHTML = '<small></small>' + teamScore[i]; d.querySelector('small').textContent = T.n; tm.appendChild(d); });
      tm.classList.remove('hidden');
    } else {
      $('ovTitle').textContent = right === history.length ? '🏆 Sempurna!' : right >= history.length * .7 ? '🎉 Hebat!' : 'Selesai!';
      $('ovScore').textContent = 'Skor ' + score + ' · ' + right + ' dari ' + history.length + ' benar';
      tm.classList.add('hidden');
    }
    var rv = $('review'); rv.innerHTML = '';
    history.forEach(function (h) { var d = document.createElement('div'); d.textContent = (h.ok ? '✅ ' : '❌ ') + h.e + '  = ' + h.a + (h.t ? ' · ' + h.t : ''); rv.appendChild(d); });
    $('over').classList.remove('hidden');
    Sfx.music(false); Sfx.win();
  }

  $('start').addEventListener('click', start);
  $('again').addEventListener('click', start);
  $('toMenu').addEventListener('click', function () { $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); });
  $('bExit').addEventListener('click', function () { if (confirm('Selesai bermain?')) end(); });
  $('bMute').addEventListener('click', function () { muted = !muted; try { localStorage.setItem('bgy_muted', muted ? '1' : '0'); } catch (e) {} this.textContent = muted ? '🔇' : '🔊'; });
  window.addEventListener('keydown', function (e) { if ($('game').classList.contains('hidden')) return; var k = '1234'.indexOf(e.key); if (k >= 0 && $('opts').children[k]) $('opts').children[k].click(); });
  if (window.Tutor) Tutor.init('tebak-emoji', [{"sel": "#segMode", "text": "Main sendiri, atau 2 tim bergantian untuk satu kelas."}, {"sel": "#segRounds", "text": "Pilih berapa ronde teka-teki."}, {"sel": "#segTime", "text": "Atur waktu menjawab tiap soal."}, {"sel": "#start", "text": "Tekan MULAI! Tebak kata dari gabungan emoji."}], { inGame: "Lihat emojinya, lalu ketuk kata yang paling cocok!" });
})();
</script>
<script src="/games/_shared/twemoji.min.js"></script>
<script src="/games/_shared/emoji.js"></script>
</body>
</html>
